<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Silicon wafer">
  <defs>
    <radialGradient id="waferGlow" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#dff7ff"/>
      <stop offset="42%" stop-color="#7ddcff"/>
      <stop offset="70%" stop-color="#3aa7e8"/>
      <stop offset="100%" stop-color="#1567b0"/>
    </radialGradient>
    <linearGradient id="shine" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="58%" stop-color="#b9f4ff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="waferClip">
      <path d="M32 4 C47.46 4 60 16.54 60 32 C60 47.46 47.46 60 32 60 C16.54 60 4 47.46 4 32 C4 16.54 16.54 4 32 4 Z"/>
    </clipPath>
  </defs>

  <!-- wafer body, with the orientation notch cut into the bottom edge -->
  <path d="M32 4
           C47.46 4 60 16.54 60 32
           C60 45.84 49.98 57.36 36.79 59.58
           L33.2 54.7
           C32.58 53.85 31.42 53.85 30.8 54.7
           L27.21 59.58
           C14.02 57.36 4 45.84 4 32
           C4 16.54 16.54 4 32 4
           Z"
        fill="url(#waferGlow)"
        stroke="#0b2540"
        stroke-width="2.6"
        stroke-linejoin="round"/>

  <!-- die grid -->
  <g clip-path="url(#waferClip)" opacity=".5" stroke="#0b3557" stroke-width="1">
    <path d="M14 4V60M24 4V60M34 4V60M44 4V60M54 4V60"/>
    <path d="M4 14H60M4 24H60M4 34H60M4 44H60M4 54H60"/>
  </g>

  <!-- glossy sweep -->
  <path d="M12 17
           C18 8 34 5 46 10
           C36 12 25 18 18 29
           C15 34 13 40 12 46
           C8.8 37 8.3 25.8 12 17Z"
        fill="url(#shine)"
        opacity=".95"/>

  <!-- crisp rim -->
  <path d="M32 5.8
           C46.47 5.8 58.2 17.53 58.2 32
           C58.2 44.62 49.28 55.16 37.39 57.68"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".42"
        stroke-width="1.4"
        stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M47 13 l1.35 3.65 L52 18 l-3.65 1.35 L47 23 l-1.35-3.65 L42 18 l3.65-1.35Z"/>
    <path d="M17 14 l.8 2.2 L20 17 l-2.2.8 L17 20 l-.8-2.2 L14 17 l2.2-.8Z" opacity=".9"/>
  </g>

  <!-- notch accent -->
  <path d="M27.2 59.55 L30.8 54.7
           C31.42 53.85 32.58 53.85 33.2 54.7
           L36.8 59.55"
        fill="#0b2540"
        opacity=".92"/>
</svg>
