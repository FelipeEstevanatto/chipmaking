<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img">
  <title>Two ways to connect a die to its package: wire bonding keeps the die face up and arcs thin wires from pads along its edges, while flip-chip turns the die face down so solder bumps can be placed anywhere on the active area</title>
  <rect width="960" height="470" fill="#ffffff" />
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .pt { font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .tag { font: 600 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lb { font: 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2d3748; }
    .sub { fill: #805ad5; stroke: #553c9a; stroke-width: 1.3; }
    .die { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.5; }
    .pad { fill: #4a5568; }
    .wire { stroke: #b7791f; stroke-width: 2.2; fill: none; }
    .bump { fill: #ed8936; stroke: #c05621; stroke-width: 1.2; }
    .lead { fill: none; stroke: #a0aec0; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .big { font: 600 40px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>

  <text class="h" x="40" y="36">Wire bonding versus flip-chip</text>
  <text class="sm" x="40" y="58">The die can face up or face down. That single choice sets how many connections are possible.</text>

  <text class="pt" x="40" y="104">Wire bonding</text>
  <text class="tag" x="230" y="104" fill="#b7791f">pads s&#243; na borda</text>

  <rect class="sub" x="70" y="308" width="360" height="38" rx="4" />
  <rect class="die" x="150" y="244" width="200" height="64" rx="3" />
  <rect class="pad" x="158" y="236" width="18" height="10" />
  <rect class="pad" x="324" y="236" width="18" height="10" />
  <path class="wire" d="M 167,236 C 128,186 110,238 108,306" />
  <path class="wire" d="M 333,236 C 372,186 390,238 392,306" />

  <text class="lb" x="250" y="284" text-anchor="middle">die</text>
  <text class="lb" x="440" y="332">substrato</text>
  <path class="lead" d="M 436,328 L 420,326" />
  <text class="lb" x="118" y="196">fio</text>
  <path class="lead" d="M 130,200 L 140,222" />

  <text class="sm" x="40" y="378">Cada fio sai de um pad na periferia do die e desce at&#233; o substrato. Os fios t&#234;m tipicamente 15 a 25 &#181;m de</text>
  <text class="sm" x="40" y="400">di&#226;metro, formam um la&#231;o acima do die e somam indut&#226;ncia e resist&#234;ncia ao caminho do sinal.</text>
  <text class="sm" x="40" y="426">Ainda assim &#233; a tecnologia dominante: monta mais de 80% dos inv&#243;lucros do mundo.</text>

  <line x1="480" y1="90" x2="480" y2="440" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="pt" x="510" y="104">Flip-chip</text>
  <text class="tag" x="660" y="104" fill="#c05621">pads em toda a &#225;rea</text>

  <rect class="sub" x="540" y="328" width="360" height="38" rx="4" />
  <rect class="die" x="620" y="240" width="200" height="62" rx="3" />
  <rect class="bump" x="640" y="302" width="22" height="26" />
  <rect class="bump" x="694" y="302" width="22" height="26" />
  <rect class="bump" x="748" y="302" width="22" height="26" />
  <rect class="bump" x="802" y="302" width="22" height="26" />
  <rect class="pad" x="644" y="292" width="14" height="10" />
  <rect class="pad" x="698" y="292" width="14" height="10" />
  <rect class="pad" x="752" y="292" width="14" height="10" />
  <rect class="pad" x="806" y="292" width="14" height="10" />
  <circle class="die" cx="650" cy="258" r="3" />
  <circle class="die" cx="680" cy="258" r="3" />
  <circle class="die" cx="710" cy="258" r="3" />
  <circle class="die" cx="740" cy="258" r="3" />
  <circle class="die" cx="770" cy="258" r="3" />
  <circle class="die" cx="800" cy="258" r="3" />

  <text class="lb" x="720" y="228" text-anchor="middle">die (face para baixo)</text>
  <text class="lb" x="910" y="352" text-anchor="end">substrato</text>
  <text class="lb" x="546" y="290">bump</text>
  <path class="lead" d="M 578,294 L 636,310" />

  <text class="sm" x="510" y="378">O die vira de cabe&#231;a para baixo e se conecta por esferas de solda ou pilares de cobre. O caminho fica curto,</text>
  <text class="sm" x="510" y="400">a indut&#226;ncia cai e os contatos podem ocupar toda a superf&#237;cie ativa, n&#227;o s&#243; a borda. Por isso microprocessadores,</text>
  <text class="sm" x="510" y="426">GPUs e aceleradores s&#227;o flip-chip: eles precisam de milhares de conex&#245;es ao mesmo tempo.</text>
</svg>
