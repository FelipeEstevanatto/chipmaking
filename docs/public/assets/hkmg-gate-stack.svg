<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img">
  <title>Gate stack comparison: SiO2 / poly-Si versus High-K / metal gate</title>
  <defs>
    <marker id="hkmgArrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#e53e3e" />
    </marker>
  </defs>
  <style>
    .lbl { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .lbl-inv { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .lbl-hk { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #44337a; }
    .note { font: 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .head { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .si { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .ox { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .hk { fill: #b794f4; stroke: #6b46c1; stroke-width: 1; }
    .poly { fill: #4a5568; stroke: #2d3748; stroke-width: 1; }
    .metal { fill: #2d3748; stroke: #1a202c; stroke-width: 1; }
    .leak { stroke: #e53e3e; stroke-width: 2.2; fill: none; marker-end: url(#hkmgArrow); }
    .lead { stroke: #718096; stroke-width: 1; fill: none; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <text class="head" x="210" y="38" text-anchor="middle">SiO<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> + poly-Si</tspan></text>
  <text class="head" x="590" y="38" text-anchor="middle">High-K + metal gate</text>

  <line class="divider" x1="400" y1="60" x2="400" y2="332" />

  <!-- Left: conventional stack -->
  <rect class="si" x="100" y="250" width="220" height="70" />
  <rect class="ox" x="100" y="238" width="220" height="12" />
  <rect class="poly" x="100" y="160" width="220" height="78" />
  <text class="lbl" x="210" y="292" text-anchor="middle">Si</text>
  <text class="lbl-inv" x="210" y="205" text-anchor="middle">poly-Si</text>

  <line class="lead" x1="97" y1="244" x2="88" y2="244" />
  <text class="note" x="85" y="248" text-anchor="end">SiO<tspan dy="4" font-size="8">2</tspan></text>

  <line class="lead" x1="323" y1="244" x2="334" y2="244" />
  <text class="note" x="338" y="248">~1 nm</text>

  <!-- tunnelling leakage -->
  <path class="leak" d="M165,190 L165,288" />
  <path class="leak" d="M210,190 L210,288" />
  <path class="leak" d="M255,190 L255,288" />

  <!-- Right: HKMG stack -->
  <rect class="si" x="480" y="250" width="220" height="70" />
  <rect class="hk" x="480" y="212" width="220" height="38" />
  <rect class="metal" x="480" y="160" width="220" height="52" />
  <text class="lbl" x="590" y="292" text-anchor="middle">Si</text>
  <text class="lbl-inv" x="590" y="192" text-anchor="middle">metal</text>
  <text class="lbl-hk" x="590" y="237" text-anchor="middle">HfO<tspan dy="4" font-size="10">2</tspan></text>

  <line class="lead" x1="703" y1="231" x2="714" y2="231" />
  <text class="note" x="718" y="235">~3 nm</text>
</svg>
