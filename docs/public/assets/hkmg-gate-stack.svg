<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img">
  <title>Gate stack comparison: a thin silicon dioxide under a polysilicon gate against a hafnium oxide film on a thin interfacial oxide under a metal gate</title>
  <desc>Two gate stacks side by side on the same silicon surface line. Left: a thin silicon dioxide under a thick polysilicon gate, with red arrows showing carriers tunnelling through the oxide into the channel. Right: a thin interfacial silicon dioxide and a physically thicker hafnium oxide high-k film under a metal gate, with no tunnelling arrows. The 45 nm process is specified at 1.0 nm equivalent oxide thickness. Not to scale.</desc>
  <rect width="800" height="400" fill="#ffffff" />
  <defs>
    <marker id="hkmgArrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#c53030" />
    </marker>
  </defs>
  <style>
    .head { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .lbl { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .inv { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .sm { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .bad { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c53030; }
    .good { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2f855a; }
    .hk { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #44337a; }
    .si { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .ox { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .hkf { fill: #b794f4; stroke: #6b46c1; stroke-width: 1; }
    .poly { fill: #4a5568; stroke: #2d3748; stroke-width: 1; }
    .metal { fill: #2d3748; stroke: #1a202c; stroke-width: 1; }
    .leak { stroke: #c53030; stroke-width: 2.2; fill: none; marker-end: url(#hkmgArrow); }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <text class="head" x="210" y="44" text-anchor="middle">SiO<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> + poly-Si</tspan></text>
  <text class="bad" x="210" y="68" text-anchor="middle">carriers tunnel through the oxide</text>

  <text class="head" x="590" y="44" text-anchor="middle">SiO<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> + HfO</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> + metal</tspan></text>
  <text class="good" x="590" y="68" text-anchor="middle">1.0 nm EOT, physically thicker</text>

  <line class="divider" x1="400" y1="88" x2="400" y2="340" />

  <!-- ================= LEFT: silicon dioxide under polysilicon ================= -->
  <rect class="si" x="110" y="250" width="200" height="90" />
  <rect class="ox" x="110" y="242" width="200" height="8" />
  <rect class="poly" x="110" y="160" width="200" height="82" />
  <text class="inv" x="210" y="192" text-anchor="middle">poly-Si</text>
  <text class="sm" x="96" y="246" text-anchor="end">SiO<tspan dy="4" font-size="10">2</tspan></text>
  <path class="lead" d="M 98,242 L 108,242" />
  <text class="sm" x="120" y="322">Si</text>
  <text class="bad" x="210" y="322" text-anchor="middle">tunnelling</text>

  <!-- tunnelling current through the thin oxide -->
  <path class="leak" d="M 150,212 L 150,300" />
  <path class="leak" d="M 210,212 L 210,300" />
  <path class="leak" d="M 270,212 L 270,300" />

  <!-- ================= RIGHT: interfacial oxide and high-k under a metal gate ================= -->
  <rect class="si" x="490" y="250" width="200" height="90" />
  <rect class="ox" x="490" y="242" width="200" height="8" />
  <rect class="hkf" x="490" y="220" width="200" height="22" />
  <rect class="metal" x="490" y="160" width="200" height="60" />
  <text class="inv" x="590" y="190" text-anchor="middle">metal gate</text>
  <text class="hk" x="590" y="235" text-anchor="middle">HfO<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> (high-k)</tspan></text>
  <text class="sm" x="700" y="247" text-anchor="start">SiO<tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> interface</tspan></text>
  <path class="lead" d="M 696,247 L 692,247" />
  <text class="sm" x="500" y="322">Si</text>
  <text class="good" x="590" y="322" text-anchor="middle">no direct tunnelling</text>
</svg>
