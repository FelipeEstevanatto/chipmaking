<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img">
  <title>The dual damascene sequence for copper wiring: the trench and via are etched into the dielectric, a barrier and seed layer are deposited, copper is electroplated up from the bottom, and the overburden is removed by chemical mechanical planarisation</title>
  <desc>Four cross-section panels in sequence: pattern the dielectric, line it with barrier and seed, electroplate copper, planarise by CMP. A metal line from the level below runs under each panel. Not to scale.</desc>
  <rect width="960" height="560" fill="#ffffff" />
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .st { font: 600 17.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .note { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .diel { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .bar { fill: none; stroke: #b7791f; stroke-width: 3.4; }
    .cu { fill: #ed8936; stroke: #c05621; stroke-width: 1.4; }
    .metal { fill: #ed8936; stroke: #c05621; stroke-width: 1.2; }
  </style>

  <text class="h" x="34" y="40">Dual damascene copper process</text>

  <!-- 1 -->
  <text class="st" x="34" y="110">1. Pattern</text>
  <path class="diel" d="M 34,250 L 100,250 L 100,310 L 123,310 L 123,390 L 149,390 L 149,310 L 172,310 L 172,250 L 238,250 L 238,390 L 34,390 Z" />
  <rect class="metal" x="34" y="390" width="204" height="22" />
  <text class="note" x="34" y="460">Trench and via are</text>
  <text class="note" x="34" y="482">etched into the</text>
  <text class="note" x="34" y="504">dielectric.</text>

  <!-- 2 -->
  <text class="st" x="266" y="110">2. Barrier and seed</text>
  <path class="diel" d="M 266,250 L 332,250 L 332,310 L 355,310 L 355,390 L 381,390 L 381,310 L 404,310 L 404,250 L 470,250 L 470,390 L 266,390 Z" />
  <rect class="metal" x="266" y="390" width="204" height="22" />
  <path class="bar" d="M 332,250 L 332,310 L 355,310 L 355,390 L 381,390 L 381,310 L 404,310 L 404,250" />
  <text class="note" x="266" y="460">A thin barrier keeps</text>
  <text class="note" x="266" y="482">copper out of the</text>
  <text class="note" x="266" y="504">dielectric.</text>

  <!-- 3 -->
  <text class="st" x="498" y="110">3. Electroplate</text>
  <path class="diel" d="M 498,250 L 564,250 L 564,310 L 587,310 L 587,390 L 613,390 L 613,310 L 636,310 L 636,250 L 702,250 L 702,390 L 498,390 Z" />
  <rect class="metal" x="498" y="390" width="204" height="22" />
  <path class="bar" d="M 564,250 L 564,310 L 587,310 L 587,390 L 613,390 L 613,310 L 636,310 L 636,250" />
  <path class="cu" d="M 498,234 L 702,234 L 702,250 L 634,250 L 634,312 L 611,312 L 611,388 L 589,388 L 589,312 L 566,312 L 566,250 L 498,250 Z" />
  <text class="note" x="498" y="460">Copper fills from the</text>
  <text class="note" x="498" y="482">bottom up, so the via</text>
  <text class="note" x="498" y="504">closes without a void.</text>

  <!-- 4 -->
  <text class="st" x="730" y="110">4. CMP</text>
  <path class="diel" d="M 730,250 L 796,250 L 796,310 L 819,310 L 819,390 L 845,390 L 845,310 L 868,310 L 868,250 L 934,250 L 934,390 L 730,390 Z" />
  <rect class="metal" x="730" y="390" width="204" height="22" />
  <path class="bar" d="M 796,250 L 796,310 L 819,310 L 819,390 L 845,390 L 845,310 L 868,310 L 868,250" />
  <path class="cu" d="M 798,250 L 798,312 L 821,312 L 821,388 L 843,388 L 843,312 L 866,312 L 866,250 Z" />
  <text class="note" x="730" y="460">The overburden is</text>
  <text class="note" x="730" y="482">polished off and the</text>
  <text class="note" x="730" y="504">surface is flat again.</text>
</svg>
