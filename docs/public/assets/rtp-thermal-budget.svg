<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img">
  <title>Temperature against time for a furnace anneal of hours and a rapid thermal anneal of seconds, with the band around 450 degrees Celsius where oxygen thermal donors form</title>
  <rect width="960" height="540" fill="#ffffff" />
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .l { font: 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .m { font: 600 16.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1d2430; }
    .grid { stroke: #cbd5e0; stroke-width: 1.1; stroke-dasharray: 6 5; }
    .axis { stroke: #4a5568; stroke-width: 1.4; }
    .band { fill: #fef3e2; stroke: #f6ad55; stroke-width: 1.1; }
    .furnace { fill: none; stroke: #2b6cb0; stroke-width: 2.6; stroke-linejoin: round; }
    .rtp { fill: none; stroke: #c53030; stroke-width: 2.6; stroke-linejoin: round; }
  </style>

  <text class="h" x="40" y="36">Furnace anneal versus rapid thermal processing</text>
  <text class="sm" x="40" y="58">Both reach the same temperature. The difference is how long the wafer stays hot.</text>

  <!-- temperature window in which oxygen clusters become thermal donors -->
  <rect class="band" x="110" y="290" width="810" height="16" />
  <text class="sm" x="130" y="284" fill="#7b341e">oxygen thermal donors form here (~450 &#176;C)</text>

  <!-- temperature axis, shared by both panels -->
  <line class="axis" x1="110" y1="142" x2="110" y2="400" />
  <line class="grid" x1="110" y1="298" x2="920" y2="298" />
  <line class="grid" x1="110" y1="214" x2="920" y2="214" />
  <line class="grid" x1="110" y1="166" x2="920" y2="166" />
  <line class="axis" x1="104" y1="166" x2="116" y2="166" />
  <line class="axis" x1="104" y1="214" x2="116" y2="214" />
  <line class="axis" x1="104" y1="298" x2="116" y2="298" />
  <line class="axis" x1="104" y1="400" x2="116" y2="400" />
  <text class="m" x="98" y="170" text-anchor="end">1000</text>
  <text class="m" x="98" y="218" text-anchor="end">800</text>
  <text class="m" x="98" y="302" text-anchor="end">450</text>
  <text class="m" x="98" y="404" text-anchor="end">25</text>
  <text class="l" x="98" y="130" text-anchor="end">&#176;C</text>

  <!-- ===================== left: furnace ===================== -->
  <text class="t" x="300" y="106" text-anchor="middle">Furnace anneal</text>
  <path class="furnace" d="M 130,396 L 158,396 L 200,166 L 400,166 L 442,396 L 462,396" />
  <text class="l" x="300" y="152" text-anchor="middle">hours at ~1000 &#176;C</text>

  <line class="axis" x1="130" y1="400" x2="470" y2="400" />
  <line class="axis" x1="130" y1="400" x2="130" y2="406" />
  <line class="axis" x1="212" y1="400" x2="212" y2="406" />
  <line class="axis" x1="295" y1="400" x2="295" y2="406" />
  <line class="axis" x1="377" y1="400" x2="377" y2="406" />
  <line class="axis" x1="460" y1="400" x2="460" y2="406" />
  <text class="m" x="130" y="424" text-anchor="middle">0</text>
  <text class="m" x="212" y="424" text-anchor="middle">2</text>
  <text class="m" x="295" y="424" text-anchor="middle">4</text>
  <text class="m" x="377" y="424" text-anchor="middle">6</text>
  <text class="m" x="460" y="424" text-anchor="middle">8</text>
  <text class="l" x="300" y="446" text-anchor="middle">hours</text>

  <!-- ===================== right: RTP ===================== -->
  <text class="t" x="750" y="106" text-anchor="middle">Rapid thermal processing</text>
  <path class="rtp" d="M 580,396 L 637,166 L 750,166 L 807,396 L 920,396" />
  <text class="l" x="693" y="152" text-anchor="middle">~10 s at 800&#8211;1000 &#176;C</text>

  <line class="axis" x1="580" y1="400" x2="920" y2="400" />
  <line class="axis" x1="580" y1="400" x2="580" y2="406" />
  <line class="axis" x1="693" y1="400" x2="693" y2="406" />
  <line class="axis" x1="807" y1="400" x2="807" y2="406" />
  <line class="axis" x1="920" y1="400" x2="920" y2="406" />
  <text class="m" x="580" y="424" text-anchor="middle">0</text>
  <text class="m" x="693" y="424" text-anchor="middle">10</text>
  <text class="m" x="807" y="424" text-anchor="middle">20</text>
  <text class="m" x="920" y="424" text-anchor="middle">30</text>
  <text class="l" x="750" y="446" text-anchor="middle">seconds</text>

  <text class="sm" x="46" y="478">A furnace step is measured in hours; RTP is measured in seconds, so the wafer keeps</text>
  <text class="sm" x="46" y="500">its dopant profile while the thermal donors are annihilated above 800 &#176;C.</text>
</svg>
