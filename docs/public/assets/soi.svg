<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img">
  <title>Bulk silicon transistor against a silicon-on-insulator transistor in a thin film on a buried oxide over a handle wafer</title>
  <desc>Two transistor cross-sections drawn on the same surface line. Left: in bulk silicon the source and drain regions are embedded in a thick substrate, so their junctions reach material that continues downwards without a boundary. Right: on a silicon-on-insulator wafer the same transistor is built in a thin silicon film that sits on a buried oxide, and the source and drain regions stop at that oxide, with an electrically inert handle wafer below it. Not to scale.</desc>
  <rect width="800" height="400" fill="#ffffff" />
  <style>
    .head { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .lbl { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .bad { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c53030; }
    .good { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2f855a; }
    .inv { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .si { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .handle { fill: #e2e8f0; stroke: #a0aec0; stroke-width: 1; }
    .nplus { fill: #2b6cb0; stroke: #2c5282; stroke-width: 1; }
    .gate { fill: #4a5568; stroke: #2d3748; stroke-width: 1; }
    .ox { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <text class="head" x="215" y="44" text-anchor="middle">Bulk Si</text>
  <text class="bad" x="215" y="68" text-anchor="middle">junctions reach the substrate</text>

  <text class="head" x="585" y="44" text-anchor="middle">SOI (thin film on oxide)</text>
  <text class="good" x="585" y="68" text-anchor="middle">junctions end at the buried oxide</text>

  <line class="divider" x1="400" y1="88" x2="400" y2="340" />

  <!-- ================= LEFT: bulk silicon ================= -->
  <rect class="si" x="85" y="175" width="260" height="165" />
  <rect class="nplus" x="105" y="175" width="62" height="62" />
  <rect class="nplus" x="263" y="175" width="62" height="62" />
  <rect class="ox" x="175" y="167" width="80" height="8" />
  <rect class="gate" x="175" y="135" width="80" height="32" />
  <text class="inv" x="215" y="157" text-anchor="middle">gate</text>
  <text class="inv" x="136" y="212" text-anchor="middle">n+</text>
  <text class="inv" x="294" y="212" text-anchor="middle">n+</text>
  <text class="sm" x="215" y="328" text-anchor="middle">substrate</text>

  <!-- ================= RIGHT: silicon on insulator ================= -->
  <rect class="handle" x="425" y="292" width="320" height="48" />
  <rect class="ox" x="425" y="220" width="320" height="72" />
  <rect class="si" x="425" y="175" width="320" height="45" />
  <rect class="nplus" x="475" y="175" width="62" height="45" />
  <rect class="nplus" x="633" y="175" width="62" height="45" />
  <rect class="ox" x="545" y="167" width="80" height="8" />
  <rect class="gate" x="545" y="135" width="80" height="32" />
  <text class="inv" x="585" y="157" text-anchor="middle">gate</text>
  <text class="inv" x="506" y="205" text-anchor="middle">n+</text>
  <text class="inv" x="664" y="205" text-anchor="middle">n+</text>
  <text class="sm" x="450" y="205" text-anchor="middle">Si film</text>
  <text class="sm" x="450" y="262" text-anchor="middle">BOX</text>
  <text class="sm" x="585" y="320" text-anchor="middle">handle wafer</text>
</svg>
