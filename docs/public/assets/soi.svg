<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img">
  <title>Bulk silicon transistor versus an SOI transistor on a buried oxide</title>
  <style>
    .lbl { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .inv { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .head { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .si { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .box { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .nplus { fill: #2b6cb0; stroke: #2c5282; stroke-width: 1; }
    .gate { fill: #4a5568; stroke: #2d3748; stroke-width: 1; }
    .ox { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <text class="head" x="215" y="44" text-anchor="middle">Bulk Si</text>
  <text class="head" x="585" y="44" text-anchor="middle">SOI</text>
  <line class="divider" x1="400" y1="60" x2="400" y2="320" />

  <!-- ================= LEFT: bulk ================= -->
  <rect class="si" x="85" y="180" width="260" height="110" />
  <rect class="nplus" x="110" y="180" width="62" height="60" />
  <rect class="nplus" x="258" y="180" width="62" height="60" />
  <rect class="ox" x="175" y="167" width="80" height="8" />
  <rect class="gate" x="175" y="135" width="80" height="32" />
  <text class="inv" x="215" y="156" text-anchor="middle">gate</text>
  <text class="inv" x="141" y="214" text-anchor="middle">n+</text>
  <text class="inv" x="289" y="214" text-anchor="middle">n+</text>
  <text class="sm" x="215" y="278" text-anchor="middle">bulk Si</text>

  <!-- ================= RIGHT: SOI ================= -->
  <rect class="si" x="425" y="252" width="320" height="48" />
  <rect class="box" x="425" y="230" width="320" height="22" />
  <rect class="si" x="425" y="190" width="320" height="40" />
  <rect class="nplus" x="480" y="190" width="70" height="40" />
  <rect class="nplus" x="620" y="190" width="70" height="40" />
  <rect class="ox" x="550" y="182" width="70" height="8" />
  <rect class="gate" x="550" y="146" width="70" height="36" />
  <text class="inv" x="585" y="169" text-anchor="middle">gate</text>
  <text class="inv" x="515" y="214" text-anchor="middle">n+</text>
  <text class="inv" x="655" y="214" text-anchor="middle">n+</text>

  <text class="sm" x="452" y="214" text-anchor="middle">film</text>
  <text class="sm" x="460" y="246">BOX</text>
  <text class="sm" x="585" y="280" text-anchor="middle">handle wafer</text>
</svg>
