<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img">
  <title>Four machine arrangements in the history of optical lithography: contact printing with the mask pressed on the wafer, proximity printing with an air gap that blurs the image, 1:1 projection printing with a wafer-sized mask, and the reduction stepper that prints a smaller image of a larger reticle one field at a time</title>
  <desc>Four exposure arrangements side by side, two per row, on the way from a mask pressed on the wafer to the reduction stepper: contact printing (1960s), proximity printing with a small air gap (1973), 1:1 projection printing with the mask at wafer size (1973 to the early 1980s), and a reduction stepper that prints a smaller image of a larger reticle, field by field (1978 to today). The dark bars are chrome on a quartz mask or reticle; the green band is the resist on the silicon, and the filled green areas are the resist the light exposed. The gap, the films and the feature sizes are not to scale, and the 10x reduction is drawn as about 2x so the rays stay readable.</desc>
  <rect width="960" height="660" fill="#ffffff" />
  <defs>
    <marker id="lgArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#805ad5" />
    </marker>
    <marker id="lgGray" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
  </defs>
  <style>
    .pt { font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .yr { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .note { font: 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .lbl { font: 600 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2d3748; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.2; }
    .res { fill: #c6f6d5; stroke: #2f855a; stroke-width: 1.2; }
    .exp { fill: #68d391; stroke: #2f855a; stroke-width: 1.2; }
    .qz { fill: #e2e8f0; stroke: #a0aec0; stroke-width: 1.2; }
    .cr { fill: #2d3748; }
    .barrel { fill: #edf2f7; stroke: #a0aec0; stroke-width: 1.2; }
    .lens { fill: #b9d9f5; fill-opacity: 0.85; stroke: #2b6cb0; stroke-width: 1.2; }
    .stage { fill: #e2e8f0; stroke: #a0aec0; stroke-width: 1.2; }
    .light { stroke: #805ad5; stroke-width: 2; fill: none; marker-end: url(#lgArrow); }
    .ray { stroke: #805ad5; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .dim { fill: none; stroke: #718096; stroke-width: 1.3; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .field { fill: #ffffff; stroke: #2b6cb0; stroke-width: 1.6; }
    .next { fill: #ffffff; stroke: #a0aec0; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>

  <!-- ==================================================================
       ROW 1. Contact and proximity. Both panels share one geometry: the
       resist sits at y=188 and the silicon at y=200, so the reader can
       compare where the mask ends up.  Only the mask moves.
       ================================================================== -->

  <!-- === 1. contact printing === -->
  <text class="pt" x="247" y="44" text-anchor="middle">Contact printing</text>
  <text class="yr" x="247" y="70" text-anchor="middle">1960s to about 1973</text>
  <path class="light" d="M 187,84 L 187,164" />
  <path class="light" d="M 247,84 L 247,164" />
  <path class="light" d="M 307,84 L 307,164" />
  <rect class="qz" x="157" y="172" width="180" height="16" />
  <rect class="cr" x="157" y="172" width="21" height="16" />
  <rect class="cr" x="196" y="172" width="42" height="16" />
  <rect class="cr" x="256" y="172" width="42" height="16" />
  <rect class="cr" x="316" y="172" width="21" height="16" />
  <rect class="res" x="157" y="188" width="180" height="12" />
  <rect class="exp" x="178" y="188" width="18" height="12" />
  <rect class="exp" x="238" y="188" width="18" height="12" />
  <rect class="exp" x="298" y="188" width="18" height="12" />
  <rect class="si" x="157" y="200" width="180" height="32" />
  <rect class="stage" x="157" y="232" width="180" height="10" />
  <path class="lead" d="M 340,188 L 356,188" />
  <text class="lbl" x="360" y="194">in contact</text>
  <text class="note" x="247" y="272" text-anchor="middle">No optics between the mask and the wafer.</text>
  <text class="note" x="247" y="294" text-anchor="middle">The mask touches the resist, so the gap is near zero.</text>
  <text class="note" x="247" y="316" text-anchor="middle">It wears the mask and contaminates the wafer.</text>

  <!-- === 2. proximity printing === -->
  <text class="pt" x="713" y="44" text-anchor="middle">Proximity printing</text>
  <text class="yr" x="713" y="70" text-anchor="middle">1973</text>
  <path class="light" d="M 653,84 L 653,136" />
  <path class="light" d="M 713,84 L 713,136" />
  <path class="light" d="M 773,84 L 773,136" />
  <rect class="qz" x="623" y="144" width="180" height="16" />
  <rect class="cr" x="623" y="144" width="21" height="16" />
  <rect class="cr" x="662" y="144" width="42" height="16" />
  <rect class="cr" x="722" y="144" width="42" height="16" />
  <rect class="cr" x="782" y="144" width="21" height="16" />
  <path class="ray" d="M 644,160 L 638,188" />
  <path class="ray" d="M 662,160 L 668,188" />
  <path class="ray" d="M 704,160 L 698,188" />
  <path class="ray" d="M 722,160 L 728,188" />
  <path class="ray" d="M 764,160 L 758,188" />
  <path class="ray" d="M 782,160 L 788,188" />
  <rect class="res" x="623" y="188" width="180" height="12" />
  <rect class="exp" x="638" y="188" width="30" height="12" />
  <rect class="exp" x="698" y="188" width="30" height="12" />
  <rect class="exp" x="758" y="188" width="30" height="12" />
  <rect class="si" x="623" y="200" width="180" height="32" />
  <rect class="stage" x="623" y="232" width="180" height="10" />
  <path class="dim" d="M 815,160 L 815,188" marker-start="url(#lgGray)" marker-end="url(#lgGray)" />
  <path class="lead" d="M 803,160 L 819,160" />
  <path class="lead" d="M 803,188 L 819,188" />
  <text class="lbl" x="824" y="180">air gap</text>
  <text class="note" x="713" y="272" text-anchor="middle">The air gap ends the wear of contact.</text>
  <text class="note" x="713" y="294" text-anchor="middle">Diffraction spreads the light: the image blurs.</text>
  <text class="note" x="713" y="316" text-anchor="middle">Resolution drops, but the mask survives.</text>

  <!-- ==================================================================
       ROW 2. Projection and the stepper. The resist sits at y=512 in both
       panels; what changes is the mask and what the optics do with it.
       ================================================================== -->

  <!-- === 3. 1:1 projection printing === -->
  <text class="pt" x="247" y="372" text-anchor="middle">1:1 projection printing</text>
  <text class="yr" x="247" y="398" text-anchor="middle">1973 to the early 1980s</text>
  <path class="light" d="M 187,412 L 187,436" />
  <path class="light" d="M 247,412 L 247,436" />
  <path class="light" d="M 307,412 L 307,436" />
  <rect class="qz" x="157" y="444" width="180" height="16" />
  <rect class="cr" x="157" y="444" width="21" height="16" />
  <rect class="cr" x="196" y="444" width="42" height="16" />
  <rect class="cr" x="256" y="444" width="42" height="16" />
  <rect class="cr" x="316" y="444" width="21" height="16" />
  <polygon class="barrel" points="192,470 302,470 288,506 206,506" />
  <ellipse class="lens" cx="247" cy="480" rx="42" ry="7" />
  <ellipse class="lens" cx="247" cy="496" rx="38" ry="7" />
  <path class="ray" d="M 187,462 L 187,512" />
  <path class="ray" d="M 247,462 L 247,512" />
  <path class="ray" d="M 307,462 L 307,512" />
  <rect class="res" x="157" y="512" width="180" height="12" />
  <rect class="exp" x="178" y="512" width="18" height="12" />
  <rect class="exp" x="238" y="512" width="18" height="12" />
  <rect class="exp" x="298" y="512" width="18" height="12" />
  <rect class="si" x="157" y="524" width="180" height="32" />
  <rect class="stage" x="157" y="556" width="180" height="10" />
  <path class="lead" d="M 340,452 L 356,452" />
  <text class="lbl" x="360" y="458">1:1 mask</text>
  <text class="note" x="247" y="606" text-anchor="middle">The mask is wafer-sized: every die at once.</text>
  <text class="note" x="247" y="628" text-anchor="middle">No contact, so the mask lasts and defects fall.</text>
  <text class="note" x="247" y="650" text-anchor="middle">The optics cover the wafer, not just one field.</text>

  <!-- === 4. reduction stepper === -->
  <text class="pt" x="713" y="372" text-anchor="middle">Reduction stepper</text>
  <text class="yr" x="713" y="398" text-anchor="middle">1978 to today</text>
  <path class="light" d="M 677,412 L 677,436" />
  <path class="light" d="M 749,412 L 749,436" />
  <rect class="qz" x="623" y="444" width="180" height="16" />
  <rect class="cr" x="665" y="444" width="24" height="16" />
  <rect class="cr" x="737" y="444" width="24" height="16" />
  <polygon class="barrel" points="663,470 763,470 733,506 693,506" />
  <ellipse class="lens" cx="713" cy="480" rx="42" ry="7" />
  <ellipse class="lens" cx="713" cy="496" rx="32" ry="7" />
  <path class="ray" d="M 665,462 L 695,512" />
  <path class="ray" d="M 689,462 L 707,512" />
  <path class="ray" d="M 737,462 L 719,512" />
  <path class="ray" d="M 761,462 L 731,512" />
  <rect class="next" x="635" y="512" width="48" height="12" />
  <rect class="field" x="689" y="512" width="48" height="12" />
  <rect class="next" x="743" y="512" width="48" height="12" />
  <rect class="exp" x="695" y="513" width="12" height="10" />
  <rect class="exp" x="719" y="513" width="12" height="10" />
  <rect class="si" x="623" y="524" width="180" height="32" />
  <rect class="stage" x="623" y="556" width="180" height="10" />
  <path class="lead" d="M 766,488 L 790,488" />
  <text class="lbl" x="794" y="494">10&#215; reduction</text>
  <text class="note" x="713" y="606" text-anchor="middle">The reticle is bigger than the image: 10&#215; reduction.</text>
  <text class="note" x="713" y="628" text-anchor="middle">One field at a time: 10 &#215; 10 mm in 1978.</text>
  <text class="note" x="713" y="650" text-anchor="middle">It won on cost per good die, not on throughput.</text>
</svg>
