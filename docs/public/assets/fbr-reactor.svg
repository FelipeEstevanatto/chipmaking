<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img">
  <title>Cross-section of a fluidized bed reactor: silane gas injected from below suspends silicon seed particles, which grow into granules and are withdrawn continuously</title>
  <rect width="960" height="650" fill="#ffffff" />
  <defs>
    <pattern id="seedSmall" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="4.2" fill="#cfd8e3" stroke="#7d8b9c" stroke-width="1.1" />
      <circle cx="24" cy="23" r="3.6" fill="#cfd8e3" stroke="#7d8b9c" stroke-width="1.1" />
    </pattern>
    <pattern id="seedLarge" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="8.6" fill="#dbe3ec" stroke="#7d8b9c" stroke-width="1.2" />
      <circle cx="33" cy="32" r="7.4" fill="#dbe3ec" stroke="#7d8b9c" stroke-width="1.2" />
    </pattern>
    <linearGradient id="heaterGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ad55" />
      <stop offset="50%" stop-color="#dd6b20" />
      <stop offset="100%" stop-color="#f6ad55" />
    </linearGradient>
    <marker id="fbrIn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b6cb0" />
    </marker>
    <marker id="fbrDown" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f855a" />
    </marker>
    <marker id="fbrPlain" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#718096" />
    </marker>
    <clipPath id="bedClip">
      <path d="M300,150 L300,470 L365,550 L555,550 L620,470 L620,150 Z" />
    </clipPath>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .l { font: 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .m { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1d2430; }
    .vessel { fill: #eef2f7; stroke: #718096; stroke-width: 3; }
    .steel { fill: #a8b3c2; stroke: #718096; stroke-width: 2; }
    .gas { fill: none; stroke: #2b6cb0; stroke-width: 2.4; }
    .gran { fill: none; stroke: #2f855a; stroke-width: 2.4; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .bubble { fill: #ffffff; opacity: 0.5; }
  </style>

  <text class="h" x="40" y="38">Fluidized bed reactor: growing granules from the gas</text>
  <text class="sm" x="40" y="62">Front cross-section. Seeds fall in at the top, grow as they sink, and leave at the bottom.</text>

  <!-- ===================== seed feed hopper ===================== -->
  <path class="steel" d="M352,88 L448,88 L432,140 L368,140 Z" />
  <path class="gas" d="M400,146 L400,176" marker-end="url(#fbrIn)" />

  <!-- ===================== vessel ===================== -->
  <rect class="steel" x="288" y="140" width="344" height="16" />
  <path class="vessel" d="M300,150 L300,470 L365,550 L555,550 L620,470 L620,150 Z" />

  <!-- ===================== the bed itself ===================== -->
  <g clip-path="url(#bedClip)">
    <rect x="300" y="196" width="320" height="150" fill="url(#seedSmall)" />
    <rect x="300" y="344" width="320" height="210" fill="url(#seedLarge)" />
    <!-- gas rising through the bed keeps the particles suspended -->
    <path class="gas" d="M360,540 L360,220" marker-end="url(#fbrIn)" opacity="0.55" />
    <path class="gas" d="M460,545 L460,205" marker-end="url(#fbrIn)" opacity="0.55" />
    <path class="gas" d="M560,540 L560,225" marker-end="url(#fbrIn)" opacity="0.55" />
    <circle class="bubble" cx="410" cy="430" r="13" />
    <circle class="bubble" cx="512" cy="390" r="10" />
    <circle class="bubble" cx="330" cy="330" r="9" />
    <circle class="bubble" cx="470" cy="300" r="11" />
    <circle class="bubble" cx="580" cy="350" r="9" />
  </g>

  <!-- ===================== heaters ===================== -->
  <rect x="266" y="180" width="20" height="270" rx="6" fill="url(#heaterGlow)" stroke="#c05621" stroke-width="1.4" />
  <rect x="634" y="180" width="20" height="270" rx="6" fill="url(#heaterGlow)" stroke="#c05621" stroke-width="1.4" />

  <!-- ===================== gas distributor and inlet ===================== -->
  <rect class="steel" x="372" y="528" width="176" height="10" rx="3" />
  <path class="gas" d="M460,612 L460,552" marker-end="url(#fbrIn)" />
  <circle cx="410" cy="522" r="3.4" fill="#2b6cb0" />
  <circle cx="460" cy="522" r="3.4" fill="#2b6cb0" />
  <circle cx="510" cy="522" r="3.4" fill="#2b6cb0" />

  <!-- ===================== granule withdrawal ===================== -->
  <path class="gran" d="M566,500 L676,538" marker-end="url(#fbrDown)" />

  <!-- ===================== labels, left column ===================== -->
  <text class="t" x="40" y="118">Seed particles in</text>
  <text class="sm" x="40" y="142">tiny silicon grains, fed</text>
  <text class="sm" x="40" y="163">from above</text>
  <path class="lead" d="M168,150 L348,132" />

  <text class="t" x="40" y="286">Fluidized bed</text>
  <text class="sm" x="40" y="310">upward gas holds the</text>
  <text class="sm" x="40" y="331">particles in suspension,</text>
  <text class="sm" x="40" y="352">so every grain is exposed</text>
  <text class="sm" x="40" y="373">to fresh gas</text>
  <path class="lead" d="M172,340 L296,340" />

  <text class="t" x="40" y="470">Gas distributor</text>
  <text class="sm" x="40" y="494">nozzles spread the feed</text>
  <text class="sm" x="40" y="515">evenly across the bed</text>
  <path class="lead" d="M176,502 L368,520" />

  <text class="t" x="498" y="586">Silane + hydrogen</text>
  <text class="m" x="498" y="612">SiH4 + H2</text>

  <!-- ===================== labels, right column ===================== -->
  <text class="t" x="690" y="222">Heating elements</text>
  <text class="sm" x="690" y="246">the wall is held at</text>
  <text class="sm" x="690" y="267">650&#8211;700 &#176;C for SiH4</text>
  <path class="lead" d="M686,258 L658,270" />

  <text class="t" x="690" y="470">Granules out</text>
  <text class="sm" x="690" y="494">withdrawn continuously,</text>
  <text class="sm" x="690" y="515">no shutdown to harvest</text>
  <path class="lead" d="M686,484 L672,486" />

  <!-- ===================== the size progression ===================== -->
  <text class="t" x="700" y="580">The grain grows as it falls</text>
  <circle cx="716" cy="606" r="5" fill="#cfd8e3" stroke="#7d8b9c" stroke-width="1.1" />
  <circle cx="772" cy="606" r="8" fill="#dbe3ec" stroke="#7d8b9c" stroke-width="1.2" />
  <circle cx="836" cy="606" r="11" fill="#dbe3ec" stroke="#7d8b9c" stroke-width="1.2" />
  <path class="lead" d="M726,606 L760,606" />
  <path class="lead" d="M784,606 L820,606" />
</svg>
