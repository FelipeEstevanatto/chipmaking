<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img">
  <title>Silicon MEMS: a released cantilever over a cavity etched into the substrate</title>
  <desc>Cross-section of a silicon MEMS cantilever. A thin beam is anchored to the substrate at its left end and hangs free over a cavity etched into the silicon below it, with the cavity walls sloping inwards from the opening down to the floor. Not to scale.</desc>
  <rect width="900" height="440" fill="#ffffff" />
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .l { font: 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sub { fill: #cbd5e0; stroke: #7d8b9c; stroke-width: 1.6; }
    .beam { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.8; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>

  <text class="h" x="40" y="40">Silicon MEMS: a released cantilever over an etched cavity</text>

  <!-- substrate with the cavity etched into its top face -->
  <path class="sub" d="M 60,210 L 290,210 L 361,310 L 619,310 L 690,210 L 840,210 L 840,400 L 60,400 Z" />

  <!-- suspended silicon beam: anchored at the left, free over the cavity -->
  <rect class="beam" x="240" y="194" width="370" height="16" />

  <!-- labels -->
  <text class="l" x="302" y="150" text-anchor="end">anchor</text>
  <path class="lead" d="M 300,156 L 292,198" />

  <text class="l" x="470" y="150" text-anchor="middle">suspended structure</text>
  <path class="lead" d="M 470,156 L 470,192" />

  <text class="l" x="640" y="150">free end</text>
  <path class="lead" d="M 642,156 L 612,194" />

  <text class="l" x="450" y="278" text-anchor="middle">etched cavity</text>
  <text class="l" x="450" y="365" text-anchor="middle">substrate</text>
</svg>
