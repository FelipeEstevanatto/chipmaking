<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img">
  <title>Wafer test: a probe card lowers needles onto the pads of one die while an electrical tester checks it</title>
  <desc>Cross-section. A wafer lies on the chuck; above it, a probe card carries fine needles that touch the pads of one die. One neighbouring die is marked pass and another fail. Schematic, not to scale.</desc>
  <rect width="960" height="360" fill="#ffffff" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030" />
    </marker>
  </defs>
  <style>
    .pt { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .inv { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .val { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .unit { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .alert { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c53030; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .metal { fill: #ed8936; stroke: #c05621; stroke-width: 1.3; }
    .gold { fill: #f6e05e; stroke: #b7791f; stroke-width: 1.3; }
    .dark { fill: #4a5568; stroke: #2d3748; stroke-width: 1.3; }
    .pcb { fill: #c6f6d5; stroke: #2f855a; stroke-width: 1.3; }
    .chip { fill: #fed7d7; stroke: #c53030; stroke-width: 1.2; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dim { fill: none; stroke: #718096; stroke-width: 1.2; }
    .wire { fill: none; stroke: #b7791f; stroke-width: 3; }
    .needle { fill: none; stroke: #2d3748; stroke-width: 3; }
    .track { fill: none; stroke: #c53030; stroke-width: 2.4; }
    .ehp { fill: #c53030; }
    .ehp2 { fill: #2b6cb0; }
  </style>

  <rect class="dark" x="300" y="60" width="380" height="40" rx="4" />
  <text class="inv" x="490" y="86" text-anchor="middle">probe card</text>
  <path class="needle" d="M 420,100 L 420,150 L 432,194" />
  <path class="needle" d="M 460,100 L 460,150 L 472,194" />
  <path class="needle" d="M 520,100 L 520,150 L 532,194" />
  <path class="needle" d="M 560,100 L 560,150 L 572,194" />
  <rect class="si" x="80" y="200" width="800" height="40" />
  <rect x="100" y="200" width="110" height="10" fill="#a0aec0" stroke="#7d8b9c" stroke-width="1" />
  <rect x="230" y="200" width="110" height="10" fill="#a0aec0" stroke="#7d8b9c" stroke-width="1" />
  <rect x="360" y="200" width="110" height="10" fill="#a0aec0" stroke="#7d8b9c" stroke-width="1" />
  <rect x="490" y="200" width="110" height="10" fill="#a0aec0" stroke="#7d8b9c" stroke-width="1" />
  <rect x="620" y="200" width="110" height="10" fill="#a0aec0" stroke="#7d8b9c" stroke-width="1" />
  <rect x="750" y="200" width="110" height="10" fill="#a0aec0" stroke="#7d8b9c" stroke-width="1" />
  <rect class="metal" x="424" y="194" width="16" height="6" />
  <rect class="metal" x="464" y="194" width="16" height="6" />
  <rect class="metal" x="524" y="194" width="16" height="6" />
  <rect class="metal" x="564" y="194" width="16" height="6" />
  <rect x="60" y="240" width="840" height="34" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.3" />
  <text class="t" x="480" y="262" text-anchor="middle">chuck</text>
  <path class="lead" d="M 580,197 L 700,150" />
  <text class="t" x="704" y="155" text-anchor="start">needles on the die pads</text>
  <path class="lead" d="M 150,214 L 150,310" />
  <text class="t" x="154" y="315" text-anchor="start">wafer, many dies</text>
  <text class="t" x="285" y="188" text-anchor="middle">pass</text>
  <text class="alert" x="805" y="188" text-anchor="middle">fail</text>
  <path class="lead" d="M 680,80 L 760,80" />
  <text class="t" x="764" y="85" text-anchor="start">to the tester</text>
</svg>
