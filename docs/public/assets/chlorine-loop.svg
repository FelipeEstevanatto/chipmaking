<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img">
  <title>The chlorine loop of polysilicon refining: metallurgical silicon is chlorinated to trichlorosilane, distilled, decomposed back to pure silicon, and the hydrochloric acid and silicon tetrachloride byproducts return to the start</title>
  <rect width="960" height="720" fill="#ffffff" />
  <defs>
    <marker id="loopArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#718096" />
    </marker>
    <marker id="loopBack" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f855a" />
    </marker>
    <marker id="loopIn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c05621" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .l { font: 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .m { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1d2430; }
    .chem { fill: #e9d8fd; stroke: #6b46c1; stroke-width: 2; }
    .solid { fill: #edf2f7; stroke: #a0aec0; stroke-width: 2; }
    .dep { fill: #bee3f8; stroke: #2b6cb0; stroke-width: 2; }
    .out { fill: #c6f6d5; stroke: #2f855a; stroke-width: 2; }
    .flow { fill: none; stroke: #718096; stroke-width: 2.4; }
    .back { fill: none; stroke: #2f855a; stroke-width: 2.4; }
    .feed { fill: none; stroke: #c05621; stroke-width: 2.4; }
  </style>

  <text class="h" x="40" y="34">The chlorine loop: what actually gets consumed</text>
  <text class="sm" x="40" y="58">Only silicon enters and leaves. The chlorine carries it through and comes back.</text>

  <!-- ===================== 1. chlorination ===================== -->
  <rect class="chem" x="120" y="100" width="290" height="124" rx="10" />
  <text class="t" x="265" y="130" text-anchor="middle">1. Chlorination</text>
  <text class="sm" x="265" y="156" text-anchor="middle">MG-Si powder meets HCl</text>
  <text class="m" x="265" y="182" text-anchor="middle">Si + 3 HCl &#8594; SiHCl3 + H2</text>
  <text class="sm" x="265" y="208" text-anchor="middle">300 &#176;C, catalyst, 80&#8211;90 % yield</text>

  <!-- ===================== 2. distillation ===================== -->
  <rect class="solid" x="590" y="100" width="290" height="124" rx="10" />
  <text class="t" x="735" y="130" text-anchor="middle">2. Distillation</text>
  <text class="sm" x="735" y="156" text-anchor="middle">TCS boiled off from the</text>
  <text class="sm" x="735" y="178" text-anchor="middle">H2, HCl and other chlorosilanes</text>
  <text class="sm" x="735" y="204" text-anchor="middle">TCS boils at 31.8 &#176;C</text>

  <!-- ===================== 3. deposition ===================== -->
  <rect class="dep" x="590" y="440" width="290" height="124" rx="10" />
  <text class="t" x="735" y="470" text-anchor="middle">3. Deposition</text>
  <text class="sm" x="735" y="496" text-anchor="middle">Gas meets the hot filament or</text>
  <text class="sm" x="735" y="518" text-anchor="middle">the fluidized bed of seeds</text>
  <text class="m" x="735" y="546" text-anchor="middle">SiHCl3 + H2 &#8594; Si + 3 HCl</text>

  <!-- ===================== 4. byproduct recycle ===================== -->
  <rect class="out" x="120" y="440" width="290" height="124" rx="10" />
  <text class="t" x="265" y="470" text-anchor="middle">4. Byproduct recycle</text>
  <text class="sm" x="265" y="496" text-anchor="middle">The SiCl4 byproduct is turned</text>
  <text class="sm" x="265" y="518" text-anchor="middle">back into TCS, not thrown away</text>
  <text class="m" x="265" y="546" text-anchor="middle">Si + 3 SiCl4 + 2 H2 &#8594; 4 SiHCl3</text>

  <!-- ===================== feed in ===================== -->
  <text class="l" x="30" y="140">MG-Si in</text>
  <path class="feed" d="M30,166 L116,166" marker-end="url(#loopIn)" />
  <text class="sm" x="30" y="196">the only silicon</text>
  <text class="sm" x="30" y="222">that is added</text>

  <!-- ===================== product out ===================== -->
  <path class="flow" d="M735,566 L735,624" marker-end="url(#loopArrow)" />
  <text class="l" x="735" y="650" text-anchor="middle">Polysilicon out</text>
  <text class="sm" x="735" y="674" text-anchor="middle">rods or granules, 7N to 11N</text>

  <!-- ===================== the loop arrows ===================== -->
  <path class="flow" d="M414,162 L584,162" marker-end="url(#loopArrow)" />
  <text class="sm" x="499" y="146" text-anchor="middle">crude TCS</text>

  <path class="flow" d="M735,228 L735,434" marker-end="url(#loopArrow)" />
  <text class="sm" x="752" y="326">pure TCS</text>

  <path class="back" d="M586,502 L414,502" marker-end="url(#loopBack)" />
  <text class="sm" x="499" y="528" text-anchor="middle">HCl + SiCl4 back</text>

  <path class="back" d="M265,436 L265,230" marker-end="url(#loopBack)" />
  <text class="sm" x="248" y="326" text-anchor="end">recycled TCS</text>

  <!-- ===================== the point ===================== -->
  <text class="t" x="499" y="300" text-anchor="middle">Nothing is burnt up</text>
  <text class="sm" x="499" y="326" text-anchor="middle">Chlorine is a carrier, not a fuel:</text>
  <text class="sm" x="499" y="348" text-anchor="middle">it leaves the deposition step as HCl,</text>
  <text class="sm" x="499" y="370" text-anchor="middle">is fed straight back to step 1, and the</text>
  <text class="sm" x="499" y="392" text-anchor="middle">SiCl4 side-product is returned too.</text>
</svg>
