<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img">
  <title>Chemical amplification in a photoresist: a conventional resist reacts once per photon, a chemically amplified resist turns one photon into an acid that deprotects many sites</title>
  <desc>Two resist panels side by side. On the left, a conventional resist: one incoming photon removes a single protecting group from the polymer chain, so one photon gives one reaction. On the right, a chemically amplified resist: one photon generates one acid molecule, and that acid catalyses the removal of many protecting groups along the chain. Not to scale.</desc>
  <rect width="960" height="390" fill="#ffffff" />
  <defs>
    <marker id="lightArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7791f" />
    </marker>
    <marker id="leadArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .pt { font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .nt { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .eq { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .chain { fill: none; stroke: #7d8b9c; stroke-width: 3; }
    .bond { fill: none; stroke: #7d8b9c; stroke-width: 2.4; }
    .grp { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .free { fill: #dbe3ec; stroke: #a0aec0; stroke-width: 1.3; }
    .acid { fill: #805ad5; stroke: #553c9a; stroke-width: 1.4; }
    .light { fill: none; stroke: #b7791f; stroke-width: 2.6; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>

  <text class="h" x="40" y="40">Chemical amplification in a photoresist</text>

  <line x1="480" y1="64" x2="480" y2="336" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ===================== left: conventional resist ===================== -->
  <text class="pt" x="40" y="84">Conventional resist</text>

  <text class="nt" x="250" y="120" text-anchor="middle">light</text>
  <path class="light" d="M 250,130 L 250,190" marker-end="url(#lightArrow)" />

  <text class="nt" x="90" y="186">polymer chain</text>
  <path class="chain" d="M 90,196 L 410,196" />

  <rect class="grp" x="98" y="212" width="24" height="20" rx="3" />
  <line class="bond" x1="110" y1="196" x2="110" y2="212" />
  <rect class="grp" x="168" y="212" width="24" height="20" rx="3" />
  <line class="bond" x1="180" y1="196" x2="180" y2="212" />
  <rect class="grp" x="308" y="212" width="24" height="20" rx="3" />
  <line class="bond" x1="320" y1="196" x2="320" y2="212" />
  <rect class="grp" x="378" y="212" width="24" height="20" rx="3" />
  <line class="bond" x1="390" y1="196" x2="390" y2="212" />

  <path class="lead" d="M 250,200 L 250,270" marker-end="url(#leadArrow)" />
  <rect class="free" x="238" y="276" width="24" height="20" rx="3" />

  <text class="nt" x="110" y="266" text-anchor="middle">protecting groups</text>
  <line class="lead" x1="110" y1="252" x2="110" y2="236" />

  <text class="eq" x="250" y="360" text-anchor="middle">1 photon &#8594; 1 reaction</text>

  <!-- ===================== right: chemically amplified resist ===================== -->
  <text class="pt" x="500" y="84">Chemically amplified resist</text>

  <text class="nt" x="710" y="120" text-anchor="middle">light</text>
  <path class="light" d="M 710,130 L 710,152" marker-end="url(#lightArrow)" />

  <circle class="acid" cx="710" cy="168" r="14" />
  <text class="nt" x="742" y="164">acid</text>

  <text class="nt" x="530" y="186">polymer chain</text>
  <path class="chain" d="M 530,196 L 890,196" />

  <path class="lead" d="M 710,182 L 570,270" marker-end="url(#leadArrow)" />
  <path class="lead" d="M 710,182 L 640,270" marker-end="url(#leadArrow)" />
  <path class="lead" d="M 710,182 L 710,270" marker-end="url(#leadArrow)" />
  <path class="lead" d="M 710,182 L 780,270" marker-end="url(#leadArrow)" />
  <path class="lead" d="M 710,182 L 850,270" marker-end="url(#leadArrow)" />

  <rect class="free" x="558" y="276" width="24" height="20" rx="3" />
  <rect class="free" x="628" y="276" width="24" height="20" rx="3" />
  <rect class="free" x="698" y="276" width="24" height="20" rx="3" />
  <rect class="free" x="768" y="276" width="24" height="20" rx="3" />
  <rect class="free" x="838" y="276" width="24" height="20" rx="3" />

  <text class="eq" x="710" y="360" text-anchor="middle">1 photon &#8594; 1 acid &#8594; many reactions</text>
</svg>
