<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img">
  <title>Two light paths side by side: DUV immersion at 193 nm shines light through a quartz reticle, glass lenses and a film of water, while EUV at 13.5 nm is absorbed by all of those and can only be reflected by multilayer mirrors in vacuum</title>
  <rect width="960" height="560" fill="#ffffff" />
  <defs>
    <marker id="dvArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sec { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .s { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2d3748; }
    .sm { font: 15.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .bxA { fill: #ebf4ff; stroke: #2b6cb0; stroke-width: 1.7; }
    .bxB { fill: #faf5ff; stroke: #805ad5; stroke-width: 1.7; }
    .flowA { stroke: #2b6cb0; stroke-width: 2.6; fill: none; }
    .flowB { stroke: #805ad5; stroke-width: 2.6; fill: none; }
  </style>

  <text class="h" x="40" y="34">DUV and EUV: two different light paths</text>
  <text class="sm" x="40" y="57">One shines through materials. The other has no choice but to bounce off them.</text>

  <!-- ===================== DUV column ===================== -->
  <text class="sec" x="250" y="106" text-anchor="middle">DUV immersion</text>
  <text class="sm" x="250" y="134" text-anchor="middle">193 nm, from an ArF excimer laser</text>

  <rect class="bxA" x="165" y="164" width="170" height="46" rx="7" />
  <text class="s" x="250" y="195" text-anchor="middle">reticle</text>
  <text class="sm" x="150" y="195" text-anchor="end">transmits light</text>

  <line class="flowA" x1="250" y1="212" x2="250" y2="240" marker-end="url(#dvArrow)" />

  <rect class="bxA" x="165" y="244" width="170" height="46" rx="7" />
  <text class="s" x="250" y="275" text-anchor="middle">projection lenses</text>
  <text class="sm" x="150" y="275" text-anchor="end">glass, in air</text>

  <line class="flowA" x1="250" y1="292" x2="250" y2="320" marker-end="url(#dvArrow)" />

  <rect class="bxA" x="165" y="324" width="170" height="60" rx="7" />
  <text class="s" x="250" y="360" text-anchor="middle">water film</text>
  <text class="sm" x="150" y="360" text-anchor="end">water, n = 1.44</text>

  <line class="flowA" x1="250" y1="386" x2="250" y2="414" marker-end="url(#dvArrow)" />

  <rect class="bxA" x="165" y="418" width="170" height="46" rx="7" />
  <text class="s" x="250" y="449" text-anchor="middle">wafer</text>

  <text class="sm" x="250" y="500" text-anchor="middle">193 nm in air; about 134 nm in water</text>
  <text class="sm" x="250" y="526" text-anchor="middle">numerical aperture up to 1.35</text>

  <!-- ===================== EUV column ===================== -->
  <text class="sec" x="700" y="106" text-anchor="middle">EUV</text>
  <text class="sm" x="700" y="134" text-anchor="middle">13.5 nm, from a tin plasma</text>

  <rect class="bxB" x="615" y="164" width="170" height="46" rx="7" />
  <text class="s" x="700" y="195" text-anchor="middle">reticle</text>
  <text class="sm" x="800" y="195">reflects light</text>

  <line class="flowB" x1="700" y1="212" x2="700" y2="240" marker-end="url(#dvArrow)" />

  <rect class="bxB" x="615" y="244" width="170" height="46" rx="7" />
  <text class="s" x="700" y="275" text-anchor="middle">projection mirrors</text>
  <text class="sm" x="800" y="275">Mo/Si mirrors</text>

  <line class="flowB" x1="700" y1="292" x2="700" y2="320" marker-end="url(#dvArrow)" />

  <rect class="bxB" x="615" y="324" width="170" height="60" rx="7" />
  <text class="s" x="700" y="360" text-anchor="middle">vacuum</text>
  <text class="sm" x="800" y="360">no air, no water</text>

  <line class="flowB" x1="700" y1="386" x2="700" y2="414" marker-end="url(#dvArrow)" />

  <rect class="bxB" x="615" y="418" width="170" height="46" rx="7" />
  <text class="s" x="700" y="449" text-anchor="middle">wafer</text>

  <text class="sm" x="700" y="500" text-anchor="middle">everything absorbs EUV, so nothing</text>
  <text class="sm" x="700" y="526" text-anchor="middle">can be a lens: numerical aperture 0.33 or 0.55</text>
</svg>
