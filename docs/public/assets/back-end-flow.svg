<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img">
  <title>The back-end sequence after the wafer leaves the fab: wafer probe to bin good die, dicing to separate them, die attach and interconnection, encapsulation into a package, and final test of the assembled part</title>
  <rect width="960" height="430" fill="#ffffff" />
  <defs>
    <marker id="beArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .st { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .note { font: 15.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .line { stroke: #a0aec0; stroke-width: 1; }
    .gold { stroke: #b7791f; stroke-width: 1.6; fill: none; }
    .pkg { fill: #ed8936; stroke: #c05621; stroke-width: 1.3; }
    .ink { fill: #e53e3e; }
    .ok { fill: #38a169; }
    .arw { stroke: #8a94a6; stroke-width: 2.4; }
  </style>

  <text class="h" x="40" y="36">From a wafer to a part you can solder</text>
  <text class="sm" x="40" y="58">Everything after the fab: separate, connect, protect, and test.</text>

  <!-- 1 wafer -->
  <circle class="si" cx="120" cy="172" r="52" />
  <line class="line" x1="68" y1="150" x2="172" y2="150" />
  <line class="line" x1="68" y1="194" x2="172" y2="194" />
  <line class="line" x1="120" y1="120" x2="120" y2="224" />
  <line class="line" x1="86" y1="130" x2="86" y2="214" />
  <line class="line" x1="154" y1="130" x2="154" y2="214" />
  <text class="st" x="120" y="256" text-anchor="middle">Wafer pronto</text>
  <text class="note" x="120" y="278" text-anchor="middle">milhares de chips</text>
  <text class="note" x="120" y="298" text-anchor="middle">ainda grudados</text>

  <line class="arw" x1="196" y1="172" x2="248" y2="172" marker-end="url(#beArrow)" />

  <!-- 2 probe -->
  <rect class="si" x="280" y="132" width="110" height="80" rx="4" />
  <line class="line" x1="280" y1="158" x2="390" y2="158" />
  <line class="line" x1="280" y1="184" x2="390" y2="184" />
  <line class="line" x1="316" y1="132" x2="316" y2="212" />
  <line class="line" x1="354" y1="132" x2="354" y2="212" />
  <path class="gold" d="M 300,108 L 316,148" />
  <path class="gold" d="M 336,108 L 336,148" />
  <rect class="ink" x="316" y="184" width="38" height="28" />
  <text class="st" x="335" y="256" text-anchor="middle">Teste de wafer</text>
  <text class="note" x="335" y="278" text-anchor="middle">cada die &#233; sondado</text>
  <text class="note" x="335" y="298" text-anchor="middle">e marcado como bom ou ruim</text>

  <line class="arw" x1="411" y1="172" x2="463" y2="172" marker-end="url(#beArrow)" />

  <!-- 3 dicing -->
  <rect class="si" x="496" y="132" width="34" height="34" rx="3" />
  <rect class="si" x="540" y="132" width="34" height="34" rx="3" />
  <rect class="si" x="584" y="132" width="34" height="34" rx="3" />
  <rect class="si" x="496" y="176" width="34" height="34" rx="3" />
  <rect class="pkg" x="540" y="176" width="34" height="34" rx="3" />
  <rect class="si" x="584" y="176" width="34" height="34" rx="3" />
  <text class="st" x="557" y="256" text-anchor="middle">Fatiamento</text>
  <text class="note" x="557" y="278" text-anchor="middle">l&#226;mina, laser ou plasma</text>
  <text class="note" x="557" y="298" text-anchor="middle">separam os dies bons</text>

  <line class="arw" x1="634" y1="172" x2="686" y2="172" marker-end="url(#beArrow)" />

  <!-- 4 package -->
  <rect class="pkg" x="722" y="152" width="60" height="20" rx="3" />
  <path class="gold" d="M 736,152 C 742,126 762,126 768,152" />
  <path class="gold" d="M 746,152 C 750,130 754,130 758,152" />
  <rect class="si" x="716" y="172" width="72" height="30" rx="3" />
  <text class="st" x="752" y="256" text-anchor="middle">Empacotamento</text>
  <text class="note" x="752" y="278" text-anchor="middle">fio ou bump, molde</text>
  <text class="note" x="752" y="298" text-anchor="middle">e solda ou esferas</text>

  <line class="arw" x1="812" y1="172" x2="864" y2="172" marker-end="url(#beArrow)" />

  <!-- 5 final test -->
  <rect class="si" x="880" y="150" width="56" height="56" rx="6" />
  <path class="ok" d="M 894,180 L 904,192 L 926,164" fill="none" stroke="#38a169" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="st" x="908" y="256" text-anchor="middle">Teste final</text>
  <text class="note" x="908" y="278" text-anchor="middle">j&#225; montado, a plena</text>
  <text class="note" x="908" y="298" text-anchor="middle">velocidade de opera&#231;&#227;o</text>

  <text class="sm" x="40" y="356">Testar antes de empacotar &#233; o que evita gastar inv&#243;lucro, fio e molde em um die que j&#225; nasceu ruim. Por isso o teste de</text>
  <text class="sm" x="40" y="378">wafer custa caro e existe: cada cart&#227;o de sondas &#233; feito sob medida e alguns t&#234;m milhares de agulhas.</text>
  <text class="sm" x="40" y="404">O teste final repete a medida depois do empacotamento, agora para pegar defeitos que o pr&#243;prio processo de montagem criou.</text>
</svg>
