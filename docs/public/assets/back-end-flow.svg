<svg xmlns="http://www.w3.org/2000/svg" width="960" height="314" viewBox="0 0 960 314" role="img">
  <title>The back-end sequence after the wafer leaves the fab: probe every die, dice the wafer into single dies along the scribe streets, attach and wire-bond the die inside a moulded package, and test the assembled part</title>
  <desc>Five stages left to right: wafer probe, dicing with a blade cutting along the scribe streets, packaging shown as a cross-section with the die attached and wire-bonded to the leads inside a moulded body, and final test. A wafer enters at the left; loose packaged parts leave at the right. Not to scale.</desc>
  <rect width="960" height="314" fill="#ffffff" />
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .st { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .note { font: 15.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .street { stroke: #7d8b9c; stroke-width: 1; fill: none; }
    .bad { fill: #c53030; stroke: #9b2c2c; stroke-width: 1.2; }
    .pad { fill: #7d8b9c; }
    .metal { fill: #8a94a6; stroke: #4a5568; stroke-width: 1; }
    .gold { stroke: #b7791f; stroke-width: 1.6; fill: none; }
    .mould { fill: #e2e8f0; stroke: #4a5568; stroke-width: 1.4; }
    .lead { stroke: #718096; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    .arw { stroke: #8a94a6; stroke-width: 2.4; }
    .ok { stroke: #2f855a; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text class="h" x="40" y="36">From a wafer to a part you can solder</text>

  <!-- 1 wafer -->
  <circle class="si" cx="120" cy="176" r="50" />
  <line class="street" x1="120" y1="128" x2="120" y2="224" />
  <line class="street" x1="98" y1="134" x2="98" y2="218" />
  <line class="street" x1="142" y1="134" x2="142" y2="218" />
  <line class="street" x1="72" y1="176" x2="168" y2="176" />
  <line class="street" x1="78" y1="154" x2="162" y2="154" />
  <line class="street" x1="78" y1="198" x2="162" y2="198" />
  <text class="st" x="120" y="258" text-anchor="middle">Wafer ready</text>
  <text class="note" x="120" y="280" text-anchor="middle">thousands of chips</text>
  <text class="note" x="120" y="300" text-anchor="middle">still joined</text>

  <line class="arw" x1="196" y1="176" x2="250" y2="176" marker-end="url(#arrowhead)" />

  <!-- 2 probe -->
  <circle class="si" cx="335" cy="176" r="50" />
  <line class="street" x1="335" y1="128" x2="335" y2="224" />
  <line class="street" x1="313" y1="134" x2="313" y2="218" />
  <line class="street" x1="357" y1="134" x2="357" y2="218" />
  <line class="street" x1="287" y1="176" x2="383" y2="176" />
  <line class="street" x1="293" y1="154" x2="377" y2="154" />
  <line class="street" x1="293" y1="198" x2="377" y2="198" />
  <rect class="bad" x="314" y="155" width="20" height="20" />
  <rect x="315" y="104" width="40" height="8" rx="2" fill="#2d3748" />
  <path class="gold" d="M 324,112 L 322,152" />
  <path class="gold" d="M 346,112 L 348,152" />
  <text class="st" x="335" y="258" text-anchor="middle">Wafer probe</text>
  <text class="note" x="335" y="280" text-anchor="middle">each die probed</text>
  <text class="note" x="335" y="300" text-anchor="middle">good and bad flagged</text>

  <line class="arw" x1="412" y1="176" x2="462" y2="176" marker-end="url(#arrowhead)" />

  <!-- 3 dicing -->
  <circle class="si" cx="512" cy="176" r="42" />
  <line class="street" x1="512" y1="140" x2="512" y2="212" />
  <line class="street" x1="496" y1="142" x2="496" y2="210" />
  <line class="street" x1="528" y1="142" x2="528" y2="210" />
  <line class="street" x1="476" y1="176" x2="548" y2="176" />
  <line class="street" x1="478" y1="160" x2="546" y2="160" />
  <line class="street" x1="478" y1="192" x2="546" y2="192" />
  <circle cx="512" cy="110" r="16" fill="#8a94a6" stroke="#4a5568" stroke-width="1.2" />
  <circle cx="512" cy="110" r="4" fill="#2d3748" />
  <line class="lead" x1="512" y1="126" x2="512" y2="136" />
  <rect class="si" x="568" y="169" width="14" height="14" rx="2" />
  <rect class="si" x="586" y="169" width="14" height="14" rx="2" />
  <rect class="si" x="604" y="169" width="14" height="14" rx="2" />
  <text class="st" x="544" y="258" text-anchor="middle">Dicing</text>
  <text class="note" x="544" y="280" text-anchor="middle">blade, laser or plasma</text>
  <text class="note" x="544" y="300" text-anchor="middle">cut along the streets</text>

  <line class="arw" x1="642" y1="176" x2="692" y2="176" marker-end="url(#arrowhead)" />

  <!-- 4 packaging: cross-section of a wire-bonded part -->
  <rect class="mould" x="712" y="136" width="80" height="64" rx="8" />
  <rect class="pad" x="738" y="192" width="28" height="5" />
  <rect class="si" x="741" y="176" width="22" height="16" />
  <rect class="metal" x="704" y="158" width="24" height="7" rx="2" />
  <rect class="metal" x="776" y="158" width="24" height="7" rx="2" />
  <path class="gold" d="M 744,176 C 738,152 730,150 726,158" />
  <path class="gold" d="M 760,176 C 766,152 774,150 778,158" />
  <text class="st" x="752" y="258" text-anchor="middle">Packaging</text>
  <text class="note" x="752" y="280" text-anchor="middle">die attach and wire bond</text>
  <text class="note" x="752" y="300" text-anchor="middle">sealed in a moulded body</text>

  <line class="arw" x1="814" y1="176" x2="864" y2="176" marker-end="url(#arrowhead)" />

  <!-- 5 final test -->
  <rect class="si" x="880" y="148" width="56" height="56" rx="6" />
  <path class="ok" d="M 894,178 L 904,190 L 926,162" />
  <text class="st" x="908" y="258" text-anchor="middle">Final test</text>
  <text class="note" x="908" y="280" text-anchor="middle">packaged part</text>
  <text class="note" x="908" y="300" text-anchor="middle">at full speed</text>

</svg>
