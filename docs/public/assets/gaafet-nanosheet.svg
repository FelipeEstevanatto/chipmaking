<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img">
  <title>Nanosheet gate-all-around transistor: three stacked silicon sheets run from the source to the drain through the gate, and a section through the gate shows the gate wrapping each sheet on all four sides</title>
  <desc>Left, an isometric view: a silicon substrate carries a source block and a drain block, the drain drawn cut away; three thin stacked sheets bridge between them, and a gate block crosses the middle of the stack. Right, a section cut through the gate: three sheets, each ringed by gate oxide, with gate material above, below and between them. Schematic, not to scale.</desc>
  <rect width="960" height="540" fill="#ffffff" />
  <style>
    .head { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .lbl { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .acc { font: 600 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2f855a; }
    .si-t { fill: #dbe3ec; stroke: #7d8b9c; stroke-width: 1.3; }
    .si-f { fill: #cbd5e0; stroke: #7d8b9c; stroke-width: 1.3; }
    .si-r { fill: #a0aec0; stroke: #7d8b9c; stroke-width: 1.3; }
    .sd-t { fill: #b2f5ea; stroke: #285e61; stroke-width: 1.3; }
    .sd-f { fill: #4fd1c5; stroke: #285e61; stroke-width: 1.3; }
    .sd-r { fill: #319795; stroke: #285e61; stroke-width: 1.3; }
    .sdc-t { fill: #b2f5ea; fill-opacity: 0.25; stroke: #285e61; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .sdc-f { fill: #4fd1c5; fill-opacity: 0.2; stroke: #285e61; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .sdc-r { fill: #319795; fill-opacity: 0.2; stroke: #285e61; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .sh-t { fill: #90cdf4; stroke: #2b6cb0; stroke-width: 1.3; }
    .sh-f { fill: #63b3ed; stroke: #2b6cb0; stroke-width: 1.3; }
    .sh-r { fill: #4299e1; stroke: #2b6cb0; stroke-width: 1.3; }
    .g-t { fill: #718096; stroke: #2d3748; stroke-width: 1.3; }
    .g-f { fill: #4a5568; stroke: #2d3748; stroke-width: 1.3; }
    .g-r { fill: #3d4756; stroke: #2d3748; stroke-width: 1.3; }
    .gate { fill: #4a5568; stroke: #2d3748; stroke-width: 1.3; }
    .sheet { fill: #63b3ed; stroke: #2b6cb0; stroke-width: 1.3; }
    .ox { fill: none; stroke: #b7791f; stroke-width: 4; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

