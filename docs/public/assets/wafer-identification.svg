<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img">
  <title>How to read a silicon wafer: the primary and secondary flats used up to 150 mm, and the orientation notch that replaces them on 200 mm and 300 mm wafers</title>
  <style>
    .t { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .h { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .s { font: 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .m { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #2d3748; }
    .note { font: 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .wafer { fill: #edf2f7; stroke: #2d3748; stroke-width: 1.8; }
    .prim { stroke: #c05621; stroke-width: 5; fill: none; stroke-linecap: round; }
    .sec { stroke: #2b6cb0; stroke-width: 5; fill: none; stroke-linecap: round; }
    .cut { fill: #ffffff; stroke: #2d3748; stroke-width: 1.8; }
    .dash { stroke: #718096; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    .vin { fill: none; stroke: #2d3748; stroke-width: 2.6; stroke-linejoin: round; }
    .box { fill: #ffffff; stroke: #cbd5e0; stroke-width: 1.2; }
  </style>
  <text class="h" x="30" y="30">Wafers with flats &#8212; 150 mm and smaller</text>
  <text class="s" x="30" y="50">The primary flat sits at the bottom. When a secondary flat is present, its angle from the primary encodes orientation and doping type together.</text>
  <path class="wafer" d="M 113.97,226.47 A 64,64 0 1 1 166.03,226.47 Z" />
  <path class="prim" d="M 166.03,226.47 L 113.97,226.47" />
  <text class="t" x="140" y="78" text-anchor="middle">P &lt;111&gt;</text>
  <text class="s" x="140" y="266" text-anchor="middle">sem flat secund&#225;rio</text>
  <path class="wafer" d="M 373.97,226.47 A 64,64 0 0 1 366.09,222.28 L 345.72,201.91 A 64,64 0 1 1 426.03,226.47 Z" />
  <path class="prim" d="M 426.03,226.47 L 373.97,226.47" />
  <path class="sec" d="M 366.09,222.28 L 345.72,201.91" />
  <text class="t" x="400" y="78" text-anchor="middle">N &lt;111&gt;</text>
  <text class="s" x="400" y="266" text-anchor="middle">secund&#225;rio a 45&#176;</text>
  <path class="wafer" d="M 633.97,226.47 A 64,64 0 0 1 597.64,182.4 L 597.64,153.6 A 64,64 0 1 1 686.03,226.47 Z" />
  <path class="prim" d="M 686.03,226.47 L 633.97,226.47" />
  <path class="sec" d="M 597.64,182.4 L 597.64,153.6" />
  <text class="t" x="660" y="78" text-anchor="middle">P &lt;100&gt;</text>
  <text class="s" x="660" y="266" text-anchor="middle">secund&#225;rio a 90&#176;</text>
  <path class="wafer" d="M 893.97,226.47 A 64,64 0 0 1 905.6,105.64 L 934.4,105.64 A 64,64 0 0 1 946.03,226.47 Z" />
  <path class="prim" d="M 946.03,226.47 L 893.97,226.47" />
  <path class="sec" d="M 905.6,105.64 L 934.4,105.64" />
  <text class="t" x="920" y="78" text-anchor="middle">N &lt;100&gt;</text>
  <text class="s" x="920" y="266" text-anchor="middle">secund&#225;rio a 180&#176;</text>
  <text class="s" x="30" y="300">The primary flat is parallel to a &lt;110&gt; plane, so it fixes the crystal reference the exposure tools align to.</text>
  <line class="prim" x1="30" y1="322" x2="58" y2="322" />
  <text class="s" x="66" y="326">primary flat</text>
  <line class="sec" x1="176" y1="322" x2="204" y2="322" />
  <text class="s" x="212" y="326">secondary flat &#8212; orientation + doping type</text>
  <text class="h" x="30" y="364">Wafers with a notch &#8212; 200 mm and 300 mm</text>
  <circle class="wafer" cx="200" cy="478" r="92" />
  <path class="cut" d="M 190,569.45 L 200,543.45 L 210,569.45 L 210,574.45 L 190,574.45 Z" />
  <text class="t" x="200" y="596" text-anchor="middle">one notch, at the bottom</text>
  <text class="s" x="200" y="614" text-anchor="middle">it marks the &lt;110&gt; axis and nothing else</text>
  <rect class="box" x="430" y="400" width="200" height="160" rx="6" />
  <text class="s" x="530" y="420" text-anchor="middle">notch, magnified</text>
  <path class="vin" d="M 470,450 L 520,500 L 570,450" />
  <line class="dash" x1="462" y1="450" x2="578" y2="450" />
  <text class="s" x="578" y="442" text-anchor="end">wafer edge</text>
  <line class="dash" x1="520" y1="450" x2="520" y2="500" />
  <text class="m" x="528" y="480">1,00 mm</text>
  <text class="m" x="520" y="516" text-anchor="middle">90&#176;</text>
  <text class="s" x="530" y="536" text-anchor="middle">the V is ground to a 90&#176; included</text>
  <text class="s" x="530" y="552" text-anchor="middle">angle, 1,00 mm deep (SEMI M1)</text>
  <text class="t" x="664" y="418">What the notch tells you</text>
  <text class="s" x="664" y="442">Its axis is aligned to &lt;110&gt; within &#177;1&#176;, so the tools know how the</text>
  <text class="s" x="664" y="460">lattice sits under the pattern. That is all it encodes.</text>
  <text class="t" x="664" y="492">What it does not tell you</text>
  <text class="s" x="664" y="516">A notched wafer has no secondary fiducial, so the notch carries no</text>
  <text class="s" x="664" y="534">doping type. P or N comes from the certificate, or from the laser mark</text>
  <text class="s" x="664" y="552">on the back: SEMI T7, with an optional A/N field.</text>
  <text class="note" x="30" y="644">Not to scale: the notch is drawn far larger than life. At its true size it is 1,00 mm deep on a 300 mm wafer &#8212; about 0,3 % of the radius.</text>
</svg>
