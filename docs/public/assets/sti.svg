<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img">
  <title>LOCOS isolation with a bird's beak versus shallow trench isolation (STI)</title>
  <style>
    .lbl { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .head { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .bad { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c53030; }
    .good { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2f855a; }
    .si { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .ox { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <text class="head" x="235" y="44" text-anchor="middle">LOCOS</text>
  <text class="head" x="585" y="44" text-anchor="middle">STI (shallow trench)</text>
  <line class="divider" x1="420" y1="60" x2="420" y2="320" />

  <!-- ================= LEFT: LOCOS ================= -->
  <rect class="si" x="85" y="205" width="300" height="80" />
  <text class="lbl" x="235" y="170" text-anchor="middle">field oxide</text>

  <!-- thick oxide mound, plus the thin lateral wedges that eat active area -->
  <path class="ox" d="M190,215 L190,196 Q190,178 212,178 L258,178 Q280,178 280,196 L280,215 Z" />
  <path class="ox" d="M190,207 L152,207 L190,215 Z" />
  <path class="ox" d="M280,207 L318,207 L280,215 Z" />

  <text class="sm" x="120" y="250">Si</text>
  <text class="sm" x="330" y="250">Si</text>

  <text class="bad" x="171" y="312" text-anchor="middle">bird's beak</text>
  <path d="M171,304 L171,216" stroke="#e53e3e" stroke-width="1.2" stroke-dasharray="4 4" fill="none" />

  <!-- ================= RIGHT: STI ================= -->
  <rect class="si" x="435" y="205" width="300" height="80" />
  <text class="lbl" x="585" y="196" text-anchor="middle">trench oxide</text>
  <rect class="ox" x="545" y="205" width="80" height="42" />

  <text class="sm" x="470" y="250">Si</text>
  <text class="sm" x="690" y="250">Si</text>

  <text class="good" x="585" y="312" text-anchor="middle">vertical walls, no encroachment</text>
  <path d="M585,304 L585,250" stroke="#38a169" stroke-width="1.2" stroke-dasharray="4 4" fill="none" />
</svg>
