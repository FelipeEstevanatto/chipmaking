<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img">
  <title>The four purification steps that turn mined quartz into high-purity quartz</title>
  <desc>Four processing steps &#8212; flotation, magnetic separation, acid leaching and calcination &#8212; with the material each one removes, from quartz as mined to a product of 99.999% silicon dioxide. Diagram of the published process, not a plant layout.</desc>
  <rect width="960" height="240" fill="#ffffff" />
  <style>
    .n { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .c { font: 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2d3748; }
    .chip { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1.2; }
    .box { fill: #ffffff; stroke: #2b6cb0; stroke-width: 1.6; }
    .edge { fill: none; stroke: #a0aec0; stroke-width: 1.6; }
    .lead { fill: none; stroke: #a0aec0; stroke-width: 1.3; stroke-dasharray: 4 3; }
  </style>

  <defs>
    <marker id="purArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#a0aec0" />
    </marker>
  </defs>

  <!-- ============ feed ============ -->
  <rect class="chip" x="10" y="60" width="116" height="104" rx="8" />
  <text class="n" x="68" y="106" text-anchor="middle">Quartz,</text>
  <text class="n" x="68" y="128" text-anchor="middle">as mined</text>

  <!-- ============ the four steps, in order ============ -->
  <rect class="box" x="150" y="60" width="144" height="104" rx="8" />
  <text class="n" x="222" y="118" text-anchor="middle">Flotation</text>

  <rect class="box" x="318" y="60" width="144" height="104" rx="8" />
  <text class="n" x="390" y="106" text-anchor="middle">Magnetic</text>
  <text class="n" x="390" y="128" text-anchor="middle">separation</text>

  <rect class="box" x="486" y="60" width="144" height="104" rx="8" />
  <text class="n" x="558" y="106" text-anchor="middle">Acid</text>
  <text class="n" x="558" y="128" text-anchor="middle">leaching</text>

  <rect class="box" x="654" y="60" width="144" height="104" rx="8" />
  <text class="n" x="726" y="118" text-anchor="middle">Calcination</text>

  <!-- ============ product ============ -->
  <rect class="chip" x="822" y="60" width="128" height="104" rx="8" />
  <text class="n" x="886" y="106" text-anchor="middle">99.999 %</text>
  <text class="n" x="886" y="128" text-anchor="middle">SiO&#8322;</text>

  <!-- ============ arrows between the boxes ============ -->
  <g class="edge" marker-end="url(#purArrow)">
    <line x1="126" y1="112" x2="146" y2="112" />
    <line x1="294" y1="112" x2="314" y2="112" />
    <line x1="462" y1="112" x2="482" y2="112" />
    <line x1="630" y1="112" x2="650" y2="112" />
    <line x1="798" y1="112" x2="818" y2="112" />
  </g>

  <!-- ============ what each step takes out ============ -->
  <g class="lead">
    <line x1="222" y1="164" x2="222" y2="188" />
    <line x1="390" y1="164" x2="390" y2="188" />
    <line x1="558" y1="164" x2="558" y2="188" />
    <line x1="726" y1="164" x2="726" y2="188" />
  </g>
  <rect class="chip" x="142" y="188" width="160" height="34" rx="17" />
  <text class="c" x="222" y="211" text-anchor="middle">feldspar and mica</text>
  <rect class="chip" x="326" y="188" width="128" height="34" rx="17" />
  <text class="c" x="390" y="211" text-anchor="middle">iron minerals</text>
  <rect class="chip" x="474" y="188" width="168" height="34" rx="17" />
  <text class="c" x="558" y="211" text-anchor="middle">surface inclusions</text>
  <rect class="chip" x="654" y="188" width="144" height="34" rx="17" />
  <text class="c" x="726" y="211" text-anchor="middle">organic residue</text>
</svg>
