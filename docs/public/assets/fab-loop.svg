<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img">
  <title>A wafer is not processed on a line but in a loop: it circles repeatedly through oxidation, deposition, lithography, etching, implantation, planarisation and metrology, accumulating roughly a thousand process steps over about three months before it leaves the fab</title>
  <rect width="960" height="680" fill="#ffffff" />
  <defs>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .node { fill: #f0f4f8; stroke: #8a94a6; stroke-width: 1.5; }
    .nt { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .ring { fill: none; stroke: #cbd5e0; stroke-width: 3; stroke-dasharray: 9 7; }
    .big { font: 600 26px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .mid { font: 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2d3748; }
    .kick { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2b6cb0; }
  </style>

  <text class="h" x="40" y="36">A fab is a loop, not a line</text>
  <text class="sm" x="40" y="58">The wafer re-enters the same modules again and again. Schematic; step counts are order-of-magnitude.</text>

  <circle class="ring" cx="480" cy="350" r="196" />
  <path d="M 676,350 A 196,196 0 0 1 620,490" fill="none" stroke="#8a94a6" stroke-width="3" marker-end="url(#loopArrow)" />
  <path d="M 340,490 A 196,196 0 0 1 284,350" fill="none" stroke="#8a94a6" stroke-width="3" marker-end="url(#loopArrow)" />

  <rect class="node" x="405" y="128" width="150" height="44" rx="9" />
  <text class="nt" x="480" y="156" text-anchor="middle">Oxida&#231;&#227;o</text>

  <rect class="node" x="561" y="198" width="150" height="44" rx="9" />
  <text class="nt" x="636" y="226" text-anchor="middle">Deposi&#231;&#227;o</text>

  <rect class="node" x="600" y="367" width="150" height="44" rx="9" />
  <text class="nt" x="675" y="395" text-anchor="middle">Litografia</text>

  <rect class="node" x="492" y="503" width="150" height="44" rx="9" />
  <text class="nt" x="567" y="531" text-anchor="middle">Corros&#227;o</text>

  <rect class="node" x="318" y="503" width="150" height="44" rx="9" />
  <text class="nt" x="393" y="531" text-anchor="middle">Implanta&#231;&#227;o</text>

  <rect class="node" x="210" y="367" width="150" height="44" rx="9" />
  <text class="nt" x="285" y="395" text-anchor="middle">Planariza&#231;&#227;o</text>

  <rect class="node" x="249" y="198" width="150" height="44" rx="9" />
  <text class="nt" x="324" y="226" text-anchor="middle">Metrologia</text>

  <text class="kick" x="480" y="322" text-anchor="middle">em m&#233;dia ~1.000 etapas</text>
  <text class="big" x="480" y="360" text-anchor="middle">~3 meses</text>
  <text class="mid" x="480" y="390" text-anchor="middle">dentro da fab, por wafer</text>
  <text class="mid" x="480" y="418" text-anchor="middle">dezenas de voltas na litografia</text>

  <text class="sm" x="40" y="612">Cada volta acrescenta uma camada fina, apaga parte dela e mede o resultado. O wafer nunca sai da linha:</text>
  <text class="sm" x="40" y="636">ele termina com bilh&#245;es de transistores empilhados em cerca de 15 a 20 n&#237;veis de metal, todos alinhados entre si.</text>
</svg>
