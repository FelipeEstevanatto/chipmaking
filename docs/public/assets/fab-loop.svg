<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img">
  <title>The seven process modules of a fab arranged around the lot transport system: a lot can travel from any module to any other, and returns to most of them dozens of times over 600 to more than 1,100 steps</title>
  <desc>Seven module cards, numbered 1 to 7 in the order the chapter covers them, sit in a circle around a central hub labelled lot transport. A two-headed spoke joins each module to the hub, so the route between modules is not fixed. The hub carries the step count (600 to 1,100+) and the cycle time (about 40 days at 28 nm to 80-85 days at 7 nm). Lithography is highlighted because it has its own chapter, and metrology because it measures the result. Schematic, not to scale.</desc>
  <rect width="960" height="700" fill="#ffffff" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .nt { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .ntLit { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a365d; }
    .ntMet { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #276749; }
    .num { font: 700 15.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .big { font: 600 24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .spoke { fill: none; stroke: #718096; stroke-width: 2; }
    .card { fill: #f7fafc; stroke: #a0aec0; stroke-width: 1.6; }
    .cardLit { fill: #b9d9f5; stroke: #2b6cb0; stroke-width: 1.8; }
    .cardMet { fill: #c6f6d5; stroke: #2f855a; stroke-width: 1.8; }
    .hub { fill: #edf2f7; stroke: #a0aec0; stroke-width: 1.6; }
    .badge { fill: #2c5282; stroke: #ffffff; stroke-width: 2.5; }
    .badgeLit { fill: #1a365d; stroke: #ffffff; stroke-width: 2.5; }
    .badgeMet { fill: #276749; stroke: #ffffff; stroke-width: 2.5; }
    .sw { stroke-width: 1.5; }
  </style>

  <text class="h" x="40" y="38">Fab process modules and lot transport</text>
  <text class="sm" x="40" y="64">route between modules set by the recipe</text>

  <path class="spoke" d="M 480.0,254.0 L 480.0,165.0" marker-start="url(#arr)" marker-end="url(#arr)" />
  <path class="spoke" d="M 572.3,298.4 L 628.1,253.9" marker-start="url(#arr)" marker-end="url(#arr)" />
  <path class="spoke" d="M 595.0,398.3 L 626.1,405.3" marker-start="url(#arr)" marker-end="url(#arr)" />
  <path class="spoke" d="M 531.2,478.3 L 568.4,555.6" marker-start="url(#arr)" marker-end="url(#arr)" />
  <path class="spoke" d="M 428.8,478.3 L 391.6,555.6" marker-start="url(#arr)" marker-end="url(#arr)" />
  <path class="spoke" d="M 365.0,398.3 L 333.9,405.3" marker-start="url(#arr)" marker-end="url(#arr)" />
  <path class="spoke" d="M 387.7,298.4 L 331.9,253.9" marker-start="url(#arr)" marker-end="url(#arr)" />

  <circle class="hub" cx="480" cy="372" r="112" />
  <text class="nt" x="480" y="324" text-anchor="middle">Lot transport</text>
  <text class="big" x="480" y="364" text-anchor="middle">600 to 1,100+</text>
  <text class="sm" x="480" y="388" text-anchor="middle">process steps</text>
  <text class="sm" x="480" y="420" text-anchor="middle">~40 days (28 nm) to</text>
  <text class="sm" x="480" y="442" text-anchor="middle">80-85 days (7 nm)</text>

  <rect class="card" x="402" y="113" width="156" height="46" rx="10" />
  <circle class="badge" cx="404" cy="115" r="12.5" />
  <text class="num" x="404" y="120" text-anchor="middle">1</text>
  <text class="nt" x="480" y="142" text-anchor="middle">Oxidation</text>

  <rect class="card" x="587" y="202" width="156" height="46" rx="10" />
  <circle class="badge" cx="589" cy="204" r="12.5" />
  <text class="num" x="589" y="209" text-anchor="middle">2</text>
  <text class="nt" x="665" y="231" text-anchor="middle">Deposition</text>

  <rect class="cardLit" x="632" y="402" width="156" height="46" rx="10" />
  <circle class="badgeLit" cx="634" cy="404" r="12.5" />
  <text class="num" x="634" y="409" text-anchor="middle">3</text>
  <text class="ntLit" x="710" y="431" text-anchor="middle">Lithography</text>

  <rect class="card" x="504" y="562" width="156" height="46" rx="10" />
  <circle class="badge" cx="506" cy="564" r="12.5" />
  <text class="num" x="506" y="569" text-anchor="middle">4</text>
  <text class="nt" x="582" y="591" text-anchor="middle">Etching</text>

  <rect class="card" x="300" y="562" width="156" height="46" rx="10" />
  <circle class="badge" cx="302" cy="564" r="12.5" />
  <text class="num" x="302" y="569" text-anchor="middle">5</text>
  <text class="nt" x="378" y="591" text-anchor="middle">Implantation</text>

  <rect class="card" x="172" y="402" width="156" height="46" rx="10" />
  <circle class="badge" cx="174" cy="404" r="12.5" />
  <text class="num" x="174" y="409" text-anchor="middle">6</text>
  <text class="nt" x="250" y="431" text-anchor="middle">Planarisation</text>

  <rect class="cardMet" x="217" y="202" width="156" height="46" rx="10" />
  <circle class="badgeMet" cx="219" cy="204" r="12.5" />
  <text class="num" x="219" y="209" text-anchor="middle">7</text>
  <text class="ntMet" x="295" y="231" text-anchor="middle">Metrology</text>

  <rect class="cardLit sw" x="286" y="664" width="24" height="16" rx="4" />
  <text class="sm" x="320" y="677">separate chapter</text>
  <rect class="cardMet sw" x="492" y="664" width="24" height="16" rx="4" />
  <text class="sm" x="526" y="677">measures the result</text>
</svg>
