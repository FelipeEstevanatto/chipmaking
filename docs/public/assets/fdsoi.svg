<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img">
  <title>Partially depleted SOI with a thick film and a floating body, against fully depleted SOI with an ultra-thin body over an ultra-thin buried oxide and a back plane</title>
  <desc>Two SOI transistors in cross-section. Left, partially depleted SOI: a thick silicon film on a buried oxide, with the top of the film inverted into a channel and a neutral body left floating below it. Right, fully depleted SOI (ultra-thin body and BOX): a film only nanometres thick on an ultra-thin buried oxide, the whole film depleted, with raised source and drain, a high-k metal gate, and a doped back plane under the oxide that a back bias uses to set the threshold voltage. Not to scale.</desc>
  <rect width="800" height="400" fill="#ffffff" />
  <style>
    .inv { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .note { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .head { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .si { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .box { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .nplus { fill: #2b6cb0; stroke: #2c5282; stroke-width: 1; }
    .gate { fill: #4a5568; stroke: #2d3748; stroke-width: 1; }
    .ox { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .chan { fill: #63b3ed; stroke: #2b6cb0; stroke-width: 1; }
    .body { fill: #dd6b20; stroke: #9b2c2c; stroke-width: 1; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <text class="head" x="200" y="30" text-anchor="middle">PD-SOI (film ~100 nm)</text>
  <text class="head" x="560" y="30" text-anchor="middle">FD-SOI (ultra-thin body and BOX)</text>
  <line class="divider" x1="380" y1="46" x2="380" y2="360" />

  <!-- ================= LEFT: partially depleted ================= -->
  <rect class="si" x="60" y="300" width="280" height="52" />
  <text class="note" x="200" y="332" text-anchor="middle">handle wafer</text>
  <rect class="box" x="60" y="278" width="280" height="22" />
  <text class="note" x="74" y="293" text-anchor="start">BOX</text>

  <rect class="si" x="60" y="236" width="280" height="42" />
  <rect class="nplus" x="75" y="236" width="58" height="42" />
  <rect class="nplus" x="267" y="236" width="58" height="42" />
  <rect class="chan" x="133" y="236" width="134" height="20" />
  <rect class="body" x="133" y="256" width="134" height="22" />

  <text class="inv" x="104" y="262" text-anchor="middle">n+</text>
  <text class="inv" x="296" y="262" text-anchor="middle">n+</text>
  <text class="inv" x="200" y="251" text-anchor="middle">channel</text>
  <text class="inv" x="200" y="271" text-anchor="middle">floating body</text>

  <rect class="ox" x="155" y="228" width="90" height="8" />
  <rect class="gate" x="155" y="192" width="90" height="36" />
  <text class="inv" x="200" y="215" text-anchor="middle">gate</text>

  <text class="note" x="200" y="378" text-anchor="middle">partially depleted: the body floats</text>

  <!-- ================= RIGHT: fully depleted (UTBB) ================= -->
  <rect class="si" x="420" y="302" width="280" height="54" />
  <rect class="body" x="420" y="318" width="280" height="18" />
  <rect class="box" x="420" y="284" width="280" height="18" />
  <rect class="si" x="420" y="274" width="280" height="10" />

  <rect class="nplus" x="434" y="252" width="80" height="22" />
  <rect class="nplus" x="606" y="252" width="80" height="22" />
  <text class="inv" x="474" y="267" text-anchor="middle">n+</text>
  <text class="inv" x="646" y="267" text-anchor="middle">n+</text>

  <rect class="ox" x="520" y="266" width="80" height="8" />
  <rect class="gate" x="520" y="230" width="80" height="36" />
  <text class="inv" x="560" y="253" text-anchor="middle">gate</text>

  <text class="note" x="708" y="258" text-anchor="start">film ~7 nm</text>
  <path class="lead" d="M704,262 L700,278" />
  <text class="note" x="708" y="302" text-anchor="start">BOX ~25 nm</text>
  <path class="lead" d="M704,298 L700,293" />
  <text class="note" x="708" y="340" text-anchor="start">back plane</text>
  <path class="lead" d="M704,336 L700,327" />
  <text class="note" x="708" y="358" text-anchor="start">handle wafer</text>
  <path class="lead" d="M704,354 L700,350" />

  <text class="note" x="560" y="378" text-anchor="middle">fully depleted; V_bb at the back plane</text>
</svg>
