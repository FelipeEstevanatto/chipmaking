<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
  <title>Wire bonding: a fine wire runs from a pad on a face-up die to the substrate, with a ball bond on the die and a wedge bond on the substrate</title>
  <desc>Cross-section of a die glued face up on a substrate. A wire leaves a ball bond on a die pad, arches up in a loop and lands on a substrate finger with a wedge bond. A row of pads on the right marks the 40 micrometre pad pitch and the 15 micrometre copper wire. Schematic, not to scale.</desc>
  <rect width="960" height="420" fill="#ffffff" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030" />
    </marker>
  </defs>
  <style>
    .pt { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .inv { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .val { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .unit { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .alert { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c53030; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .metal { fill: #ed8936; stroke: #c05621; stroke-width: 1.3; }
    .gold { fill: #f6e05e; stroke: #b7791f; stroke-width: 1.3; }
    .dark { fill: #4a5568; stroke: #2d3748; stroke-width: 1.3; }
    .pcb { fill: #c6f6d5; stroke: #2f855a; stroke-width: 1.3; }
    .chip { fill: #fed7d7; stroke: #c53030; stroke-width: 1.2; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dim { fill: none; stroke: #718096; stroke-width: 1.2; }
    .wire { fill: none; stroke: #b7791f; stroke-width: 3; }
    .needle { fill: none; stroke: #2d3748; stroke-width: 3; }
    .track { fill: none; stroke: #c53030; stroke-width: 2.4; }
    .ehp { fill: #c53030; }
    .ehp2 { fill: #2b6cb0; }
  </style>

  <rect class="pcb" x="60" y="300" width="560" height="40" />
  <text class="t" x="80" y="326">substrate</text>
  <rect class="si" x="220" y="230" width="260" height="70" />
  <text class="t" x="350" y="272" text-anchor="middle">die, face up</text>
  <rect class="metal" x="440" y="224" width="30" height="6" />
  <rect class="metal" x="540" y="294" width="50" height="6" />
  <path class="wire" d="M 455,214 C 470,120 560,130 562,290" />
  <circle class="gold" cx="455" cy="216" r="9" />
  <path class="gold" d="M 548,290 L 580,290 L 586,294 L 544,294 Z" />
  <path class="lead" d="M 452,214 L 300,170" />
  <text class="t" x="296" y="175" text-anchor="end">ball bond on the die pad</text>
  <path class="lead" d="M 580,292 L 640,252" />
  <text class="t" x="644" y="257" text-anchor="start">wedge bond</text>
  <path class="lead" d="M 530,150 L 640,130" />
  <text class="t" x="644" y="135" text-anchor="start">wire loop</text>
  <text class="pt" x="700" y="330">pad pitch</text>
  <rect class="metal" x="710" y="346" width="40" height="10" />
  <rect class="metal" x="770" y="346" width="40" height="10" />
  <rect class="metal" x="830" y="346" width="40" height="10" />
  <path class="dim" d="M 730,374 L 790,374" marker-start="url(#arr)" marker-end="url(#arr)" />
  <text x="760" y="398" text-anchor="middle"><tspan class="val">40</tspan><tspan class="unit"> &#181;m</tspan></text>
  <text x="900" y="300" text-anchor="end"><tspan class="unit">Cu wire </tspan><tspan class="val">15</tspan><tspan class="unit"> &#181;m</tspan></text>
</svg>
