<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
  <title>How an EUV source makes 13.5 nm light: a CO2 laser hits falling tin droplets inside a vacuum vessel, the plasma emits extreme ultraviolet light, and a parabolic collector mirror focuses it to the intermediate focus that feeds the illuminator</title>
  <rect width="960" height="620" fill="#ffffff" />
  <defs>
    <marker id="euvArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
    <marker id="euvLaserArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .s { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2d3748; }
    .sm { font: 15.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .vessel { fill: #f7fafc; stroke: #a0aec0; stroke-width: 1.6; stroke-dasharray: 7 5; }
    .box { fill: #e2e8f0; stroke: #718096; stroke-width: 1.5; }
    .drop { fill: #dd6b20; stroke: #9c4221; stroke-width: 1.2; }
    .beam { stroke: #c53030; stroke-width: 3.4; fill: none; stroke-linecap: round; }
    .ray { stroke: #805ad5; stroke-width: 1.7; fill: none; }
    .arc { stroke: #805ad5; stroke-width: 3.6; fill: none; }
    .arcIn { stroke: #b794f4; stroke-width: 1.3; fill: none; }
    .plasma { fill: #ed8936; stroke: #c05621; stroke-width: 1.4; }
    .spark { stroke: #ed8936; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    .if { fill: none; stroke: #2b6cb0; stroke-width: 2.4; }
    .out { stroke: #2b6cb0; stroke-width: 2.7; fill: none; }
  </style>

  <text class="h" x="40" y="34">The EUV source: turning tin into 13.5 nm light</text>
  <text class="sm" x="40" y="60">All of this happens in vacuum, because air absorbs EUV. Schematic, not to scale.</text>

  <!-- ===================== vacuum vessel ===================== -->
  <rect class="vessel" x="150" y="84" width="750" height="386" rx="14" />
  <text class="sm" x="188" y="108">vacuum vessel</text>

  <!-- ===================== droplet generator ===================== -->
  <rect class="box" x="430" y="92" width="120" height="40" rx="7" />
  <text class="s" x="566" y="110">tin droplet generator</text>
  <text class="sm" x="566" y="134">50,000 droplets per second</text>

  <!-- falling droplets, down the axis -->
  <circle class="drop" cx="490" cy="162" r="5.5" />
  <circle class="drop" cx="490" cy="196" r="5.5" />
  <circle class="drop" cx="490" cy="230" r="5.5" />

  <text class="sm" x="418" y="200" text-anchor="end">droplets of about 25 &#181;m</text>
  <text class="sm" x="418" y="224" text-anchor="end">falling at 70 m/s</text>

  <!-- the plasma flash -->
  <circle class="plasma" cx="490" cy="300" r="13" />
  <g class="spark">
    <line x1="490" y1="275" x2="490" y2="262" />
    <line x1="471" y1="284" x2="462" y2="275" />
    <line x1="509" y1="284" x2="518" y2="275" />
    <line x1="465" y1="316" x2="456" y2="325" />
    <line x1="515" y1="316" x2="524" y2="325" />
    <line x1="466" y1="300" x2="453" y2="300" />
    <line x1="514" y1="300" x2="527" y2="300" />
  </g>
  <text class="s" x="415" y="352" text-anchor="end">tin plasma</text>
  <text class="sm" x="415" y="376" text-anchor="end">~40&#215; the Sun's surface</text>

  <!-- ===================== the CO2 laser ===================== -->
  <line class="beam" x1="366" y1="530" x2="366" y2="470" />
  <line class="beam" x1="366" y1="470" x2="487" y2="303" marker-end="url(#euvLaserArrow)" />
  <text class="s" x="366" y="556" text-anchor="middle">CO&#8322; laser (TRUMPF), fed from the sub-fab</text>
  <text class="sm" x="450" y="420">pre-pulse, then main pulse</text>

  <!-- ===================== collector mirror ===================== -->
  <path class="arc" d="M 690,192 Q 810,300 690,408" />
  <path class="arcIn" d="M 682,203 Q 795,300 682,397" />
  <path class="arcIn" d="M 675,213 Q 781,300 675,387" />
  <text class="s" x="770" y="286">collector mirror</text>
  <text class="sm" x="770" y="310">parabolic</text>

  <!-- ===================== the EUV rays: plasma -> collector -> intermediate focus ===================== -->
  <g class="ray">
    <line x1="490" y1="300" x2="721" y2="224" />
    <line x1="721" y1="224" x2="330" y2="300" />
    <line x1="490" y1="300" x2="742" y2="261" />
    <line x1="742" y1="261" x2="330" y2="300" />
    <line x1="490" y1="300" x2="750" y2="300" />
    <line x1="490" y1="300" x2="742" y2="339" />
    <line x1="742" y1="339" x2="330" y2="300" />
    <line x1="490" y1="300" x2="721" y2="376" />
    <line x1="721" y1="376" x2="330" y2="300" />
  </g>

  <!-- ===================== intermediate focus and output ===================== -->
  <ellipse class="if" cx="330" cy="300" rx="7" ry="15" />
  <text class="s" x="330" y="268" text-anchor="middle">intermediate focus</text>
  <line class="out" x1="318" y1="300" x2="196" y2="300" marker-end="url(#euvArrow)" />
  <text class="s" x="250" y="332" text-anchor="middle">to the illuminator</text>
</svg>
