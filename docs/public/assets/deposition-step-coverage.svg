<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img">
  <title>Step coverage in a trench for three deposition methods: sputtering is directional and leaves the bottom almost bare, CVD is conformal but builds up at the trench mouth, and ALD coats every surface with the same thickness because each cycle is self-limiting</title>
  <desc>The same trench profile coated by three methods: PVD, CVD and ALD. The trench is identical in all three panels; film thickness is not to scale.</desc>
  <rect width="960" height="620" fill="#ffffff" />
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .pt { font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .tag { font: 600 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.5; }
    .fPVD { fill: #f6ad55; stroke: #c05621; stroke-width: 1.2; }
    .fCVD { fill: #68d391; stroke: #276749; stroke-width: 1.2; }
    .fALD { fill: #90cdf4; stroke: #2b6cb0; stroke-width: 1.2; }
    .note { font: 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
  </style>

  <text class="h" x="40" y="36">Deposition: how a film covers a trench</text>

  <text class="pt" x="180" y="106" text-anchor="middle">PVD (sputtering)</text>
  <text class="tag" x="180" y="128" text-anchor="middle" fill="#b7791f">directional</text>
  <path class="si" d="M 50,250 L 135,250 L 135,390 L 225,390 L 225,250 L 310,250 L 310,470 L 50,470 Z" />
  <path class="fPVD" d="M 50,234 L 133,234 L 133,389 L 227,389 L 227,234 L 310,234 L 310,250 L 225,250 L 225,390 L 135,390 L 135,250 L 50,250 Z" />
  <text class="note" x="180" y="500" text-anchor="middle">The trench floor stays</text>
  <text class="note" x="180" y="522" text-anchor="middle">almost bare.</text>

  <text class="pt" x="480" y="106" text-anchor="middle">CVD / PECVD</text>
  <text class="tag" x="480" y="128" text-anchor="middle" fill="#276749">conformal, with overhang</text>
  <path class="si" d="M 350,250 L 435,250 L 435,390 L 525,390 L 525,250 L 610,250 L 610,470 L 350,470 Z" />
  <path class="fCVD" d="M 350,236 L 429,236 L 429,386 L 531,386 L 531,236 L 610,236 L 610,250 L 525,250 L 525,390 L 435,390 L 435,250 L 350,250 Z" />
  <text class="note" x="480" y="500" text-anchor="middle">Coats everything, but thickens</text>
  <text class="note" x="480" y="522" text-anchor="middle">at the mouth and pinches the channel.</text>

  <text class="pt" x="780" y="106" text-anchor="middle">ALD</text>
  <text class="tag" x="780" y="128" text-anchor="middle" fill="#2b6cb0">self-limiting</text>
  <path class="si" d="M 650,250 L 735,250 L 735,390 L 825,390 L 825,250 L 910,250 L 910,470 L 650,470 Z" />
  <path class="fALD" d="M 650,240 L 725,240 L 725,380 L 835,380 L 835,240 L 910,240 L 910,250 L 825,250 L 825,390 L 735,390 L 735,250 L 650,250 Z" />
  <text class="note" x="780" y="500" text-anchor="middle">Same thickness on every</text>
  <text class="note" x="780" y="522" text-anchor="middle">surface, wall and floor.</text>

</svg>
