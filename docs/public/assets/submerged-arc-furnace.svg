<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img">
  <title>Cross-section of a submerged-arc furnace for silicon, with its zones, gas path and tapping</title>
  <desc>Cross-section of an industrial silicon furnace: three pre-baked carbon electrodes piercing a charge of quartz and carbon, cavities (craters) around the electrode tips where the metal is produced at about 2000 &#176;C, a crust of condensate bridging over each cavity, SiO and CO rising through the cooler charge where the SiO is recovered, a pool of molten silicon tapped through a hole at the bottom, and the off-gas taken to a bag filter and a heat recovery unit. The zones and their reactions are listed in the key on the left. Not to scale.</desc>
  <rect width="1000" height="780" fill="#ffffff" />
  <style>
    .t { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .eq { font: 600 16px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #2d3748; }
    .s { font: 15.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .in { font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2d3748; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .shell { fill: #e2e8f0; stroke: #718096; stroke-width: 2; }
    .lining { fill: none; stroke: #4a5568; stroke-width: 9; }
    .charge { fill: #fefcbf; stroke: #b7791f; stroke-width: 1.6; }
    .crust { fill: none; stroke: #b7791f; stroke-width: 7; stroke-linecap: round; }
    .crater { fill: url(#craterGlow); stroke: #4a5568; stroke-width: 5; }
    .metal { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 2; }
    .rod { fill: #2d3748; stroke: #1a202c; stroke-width: 1.5; }
    .rodBack { fill: #4a5568; stroke: #2d3748; stroke-width: 1.5; }
    .clamp { fill: #718096; stroke: #4a5568; stroke-width: 1.5; }
    .gas { fill: none; stroke: #a0aec0; stroke-width: 2; }
    .duct { fill: #edf2f7; stroke: #a0aec0; stroke-width: 1.8; }
    .heat { fill: none; stroke: #dd6b20; stroke-width: 2.4; }
    .pour { fill: none; stroke: #c53030; stroke-width: 4; stroke-linecap: round; }
    .dim { fill: none; stroke: #718096; stroke-width: 1.2; }
  </style>

  <defs>
    <marker id="fArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#a0aec0" />
    </marker>
    <marker id="hArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#dd6b20" />
    </marker>
    <marker id="dArrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#718096" />
    </marker>
    <radialGradient id="craterGlow" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#f6ad55" />
      <stop offset="58%" stop-color="#fed7d7" />
      <stop offset="100%" stop-color="#e53e3e" />
    </radialGradient>
  </defs>

  <!-- ==================== key: the zones and their reactions ==================== -->
  <text class="t" x="20" y="306">Inside the furnace</text>

  <rect x="20" y="322" width="20" height="20" fill="#fefcbf" stroke="#b7791f" stroke-width="1.4" />
  <text class="in" x="52" y="338">Outer reaction zone</text>
  <text class="s" x="52" y="362">~1600 &#176;C</text>
  <text class="eq" x="52" y="386">SiO&#8322; + 3C &#8594; SiC + 2CO</text>

  <rect x="20" y="410" width="20" height="20" fill="#fed7d7" stroke="#c53030" stroke-width="1.4" />
  <text class="in" x="52" y="426">Inner reaction zone (crater)</text>
  <text class="s" x="52" y="450">~2000 &#176;C</text>
  <text class="eq" x="52" y="474">SiO&#8322; + 2SiC &#8594; 3Si + 2CO</text>

  <rect x="20" y="498" width="20" height="20" fill="#a0aec0" stroke="#718096" stroke-width="1.4" />
  <text class="in" x="52" y="514">SiO gas, recovered in the charge</text>
  <text class="s" x="52" y="538">above 1500 &#176;C, and by condensation</text>
  <text class="eq" x="52" y="562">2SiO&#8322; + SiC &#8594; 3SiO + CO</text>

  <!-- ==================== plan view inset ==================== -->
  <circle cx="105" cy="140" r="40" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.6" />
  <circle cx="105" cy="110" r="11" class="rod" />
  <circle cx="79" cy="155" r="11" class="rodBack" />
  <circle cx="131" cy="155" r="11" class="rodBack" />
  <text class="s" x="105" y="200" text-anchor="middle">Plan: electrodes at 120&#176;</text>

  <!-- ==================== off-gas hood, duct, filter and heat recovery ==================== -->
  <path class="duct" d="M390,306 L690,306 L680,258 L400,258 Z" />
  <path class="duct" d="M680,258 L800,258 L800,306" />
  <rect class="duct" x="800" y="306" width="150" height="92" rx="4" />
  <path class="gas" d="M824,318 L824,386 M846,318 L846,386 M868,318 L868,386 M890,318 L890,386 M912,318 L912,386 M934,318 L934,386" />
  <text class="in" x="875" y="424" text-anchor="middle">Bag filter</text>
  <text class="s" x="875" y="446" text-anchor="middle">silica fume</text>
  <path class="duct" d="M875,258 L875,120" />
  <path class="gas" d="M875,120 L875,86" marker-end="url(#fArrow)" />
  <text class="s" x="890" y="106">clean gas</text>

  <rect class="duct" x="800" y="462" width="150" height="50" rx="4" />
  <path class="heat" d="M814,502 L814,472 L836,502 L836,472 L858,502 L858,472 L880,502 L880,472 L902,502 L902,472 L924,502 L924,472 L946,502 L946,472" />
  <text class="in" x="875" y="538" text-anchor="middle">Heat recovery</text>
  <text class="s" x="875" y="558" text-anchor="middle">hot water, steam</text>
  <path class="heat" d="M800,300 Q774,340 774,382 Q774,428 800,470" marker-end="url(#hArrow)" />

  <!-- ==================== the vessel ==================== -->
  <path class="shell" d="M360,306 L360,600 Q360,648 420,648 L640,648 Q700,648 700,600 L700,306 Z" />
  <path class="lining" d="M376,318 L376,596 Q376,630 426,630 L634,630 Q684,630 684,596 L684,318" />

  <!-- charge, heaped over each cavity and bridged by the crust of condensate -->
  <path class="charge" d="M380,420 L380,548 L680,548 L680,420 L648,420 L636,366 L554,366 L542,420 L458,420 L446,366 L364,366 L352,420 Z" />
  <path class="crust" d="M356,402 Q420,370 484,402" />
  <path class="crust" d="M556,402 Q620,370 684,402" />

  <!-- the craters around the electrode tips -->
  <ellipse class="crater" cx="420" cy="486" rx="68" ry="56" />
  <ellipse class="crater" cx="640" cy="486" rx="68" ry="56" />
  <ellipse cx="420" cy="486" rx="24" ry="40" fill="#f6ad55" />
  <ellipse cx="640" cy="486" rx="24" ry="40" fill="#f6ad55" />
  <ellipse cx="420" cy="508" rx="14" ry="9" fill="#fefcbf" />
  <ellipse cx="640" cy="508" rx="14" ry="9" fill="#fefcbf" />

  <!-- the metal pool at the bottom of the hearth -->
  <path class="metal" d="M390,566 L670,566 L670,600 Q670,622 640,622 L420,622 Q390,622 390,600 Z" />

  <!-- ==================== the electrodes, through the roof and into the craters ==================== -->
  <rect class="clamp" x="400" y="228" width="42" height="16" rx="3" />
  <rect class="clamp" x="510" y="228" width="42" height="16" rx="3" />
  <rect class="clamp" x="620" y="228" width="42" height="16" rx="3" />
  <rect class="rodBack" x="513" y="96" width="34" height="386" />
  <rect class="rod" x="403" y="96" width="34" height="404" />
  <rect class="rod" x="623" y="96" width="34" height="404" />
  <path class="heat" d="M376,124 L376,172" marker-end="url(#hArrow)" />
  <path class="heat" d="M686,124 L686,172" marker-end="url(#hArrow)" />
  <text class="t" x="530" y="48" text-anchor="middle">Pre-baked carbon electrodes, about 1 m across</text>
  <text class="s" x="530" y="72" text-anchor="middle">consumed and slipping down as the furnace runs</text>

  <!-- ==================== feed chutes ==================== -->
  <path class="duct" d="M170,112 L380,272 L410,262 L216,112 Z" />
  <path class="duct" d="M830,112 L620,272 L590,262 L784,112 Z" />
  <text class="in" x="196" y="94" text-anchor="middle">Quartz + carbon</text>
  <text class="s" x="150" y="252" text-anchor="middle">from the silos</text>

  <!-- ==================== gas rising through the charge ==================== -->
  <path class="gas" d="M420,432 Q406,394 426,360 L426,318" marker-end="url(#fArrow)" />
  <path class="gas" d="M640,432 Q654,394 634,360 L634,318" marker-end="url(#fArrow)" />
  <path class="gas" d="M530,432 L530,318" marker-end="url(#fArrow)" />
  <text class="in" x="706" y="240">Off-gas: CO + SiO</text>

  <!-- ==================== in-drawing labels ==================== -->
  <text class="in" x="470" y="470" text-anchor="middle">Charge</text>
  <text class="in" x="530" y="602" text-anchor="middle">Molten silicon</text>
  <text class="s" x="484" y="334" text-anchor="middle">crust</text>
  <path class="lead" d="M482,342 L472,394" />
  <text class="s" x="346" y="600" text-anchor="end">shell and lining</text>
  <path class="lead" d="M350,596 L368,588" />

  <!-- ==================== tapping ==================== -->
  <rect x="694" y="590" width="22" height="12" fill="#c53030" />
  <path class="pour" d="M704,606 Q718,634 748,646" />
  <path class="duct" d="M722,642 L786,642 L786,694 L722,694 Z" />
  <text class="in" x="754" y="676" text-anchor="middle">ladle</text>
  <text class="s" x="712" y="586">tap hole</text>
  <text class="s" x="800" y="640">Refining and casting</text>
  <text class="s" x="800" y="662">98.5 to 99.5 % Si</text>

  <!-- ==================== shell dimension ==================== -->
  <path class="dim" d="M360,668 L360,684 M360,676 L700,676 M700,668 L700,684" marker-start="url(#dArrow)" marker-end="url(#dArrow)" />
  <text class="s" x="530" y="702" text-anchor="middle">Shell about 10 m across</text>
</svg>
