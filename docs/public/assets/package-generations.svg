<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img">
  <title>Four generations of chip connection, from wires along the die edge, through flip-chip bumps above 130 microns, to micro-bumps near 40 microns on a 2.5D interposer, and finally stacked dies joined directly at under 10 microns</title>
  <desc>Four packaging generations side by side: wire bonding, flip-chip on bumps, 2.5D with dies sitting on micro-bumps over a through-silicon-via interposer, and 3D with dies directly bonded and wired down by through-silicon vias. Not to scale.</desc>
  <rect width="960" height="356" fill="#ffffff" />
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .pt { font: 600 17.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .tag { font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub { fill: #805ad5; stroke: #553c9a; stroke-width: 1.3; }
    .die { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .hbm { fill: #90cdf4; stroke: #2b6cb0; stroke-width: 1.4; }
    .ip { fill: #e2e8f0; stroke: #718096; stroke-width: 1.4; }
    .pad { fill: #4a5568; }
    .bump { fill: #ed8936; stroke: #c05621; stroke-width: 1.1; }
    .ball { fill: #cbd5e0; stroke: #718096; stroke-width: 1.2; }
    .wire { stroke: #b7791f; stroke-width: 2; fill: none; }
    .tsv { stroke: #2b6cb0; stroke-width: 2; }
    .cu { fill: #ed8936; }
  </style>

  <text class="h" x="40" y="36">How many connections, and how close together</text>

  <!-- 1 wire-bond -->
  <text class="pt" x="40" y="100">Wire-bond BGA</text>
  <text class="tag" x="40" y="122" fill="#b7791f">wire: 15 to 25 &#181;m</text>
  <rect class="sub" x="55" y="276" width="160" height="34" rx="3" />
  <rect class="die" x="93" y="238" width="84" height="38" rx="3" />
  <rect class="pad" x="95" y="230" width="12" height="8" />
  <rect class="pad" x="163" y="230" width="12" height="8" />
  <path class="wire" d="M 101,230 C 70,198 58,236 60,276" />
  <path class="wire" d="M 169,230 C 200,198 212,236 210,276" />
  <circle class="ball" cx="75" cy="318" r="8" />
  <circle class="ball" cx="105" cy="318" r="8" />
  <circle class="ball" cx="135" cy="318" r="8" />
  <circle class="ball" cx="165" cy="318" r="8" />
  <circle class="ball" cx="195" cy="318" r="8" />

  <!-- 2 flip-chip -->
  <text class="pt" x="272" y="100">Flip-chip BGA</text>
  <text class="tag" x="272" y="122" fill="#c05621">bump C4: above 130 &#181;m</text>
  <rect class="sub" x="287" y="276" width="160" height="34" rx="3" />
  <rect class="die" x="317" y="224" width="100" height="38" rx="3" />
  <circle class="bump" cx="332" cy="269" r="7" />
  <circle class="bump" cx="358" cy="269" r="7" />
  <circle class="bump" cx="384" cy="269" r="7" />
  <circle class="bump" cx="410" cy="269" r="7" />
  <circle class="ball" cx="307" cy="318" r="8" />
  <circle class="ball" cx="337" cy="318" r="8" />
  <circle class="ball" cx="367" cy="318" r="8" />
  <circle class="ball" cx="397" cy="318" r="8" />
  <circle class="ball" cx="427" cy="318" r="8" />

  <!-- 3 2.5D -->
  <text class="pt" x="504" y="100">2.5D with interposer</text>
  <text class="tag" x="504" y="122" fill="#2b6cb0">microbump: about 40 &#181;m</text>
  <rect class="sub" x="519" y="276" width="160" height="34" rx="3" />
  <ellipse class="bump" cx="557" cy="272" rx="5" ry="4" />
  <ellipse class="bump" cx="587" cy="272" rx="5" ry="4" />
  <ellipse class="bump" cx="617" cy="272" rx="5" ry="4" />
  <ellipse class="bump" cx="647" cy="272" rx="5" ry="4" />
  <rect class="ip" x="539" y="244" width="120" height="24" rx="3" />
  <line class="tsv" x1="557" y1="244" x2="557" y2="268" />
  <line class="tsv" x1="587" y1="244" x2="587" y2="268" />
  <line class="tsv" x1="617" y1="244" x2="617" y2="268" />
  <line class="tsv" x1="647" y1="244" x2="647" y2="268" />
  <rect class="die" x="545" y="202" width="48" height="36" rx="3" />
  <rect class="hbm" x="605" y="202" width="48" height="36" rx="3" />
  <ellipse class="bump" cx="553" cy="241" rx="4" ry="3" />
  <ellipse class="bump" cx="569" cy="241" rx="4" ry="3" />
  <ellipse class="bump" cx="585" cy="241" rx="4" ry="3" />
  <ellipse class="bump" cx="613" cy="241" rx="4" ry="3" />
  <ellipse class="bump" cx="629" cy="241" rx="4" ry="3" />
  <ellipse class="bump" cx="645" cy="241" rx="4" ry="3" />
  <circle class="ball" cx="539" cy="318" r="8" />
  <circle class="ball" cx="569" cy="318" r="8" />
  <circle class="ball" cx="599" cy="318" r="8" />
  <circle class="ball" cx="629" cy="318" r="8" />
  <circle class="ball" cx="659" cy="318" r="8" />

  <!-- 4 3D stacked -->
  <text class="pt" x="736" y="100">3D stacked</text>
  <text class="tag" x="736" y="122" fill="#276749">direct bond: below 10 &#181;m</text>
  <rect class="sub" x="751" y="276" width="160" height="34" rx="3" />
  <ellipse class="bump" cx="785" cy="272" rx="5" ry="4" />
  <ellipse class="bump" cx="815" cy="272" rx="5" ry="4" />
  <ellipse class="bump" cx="845" cy="272" rx="5" ry="4" />
  <ellipse class="bump" cx="875" cy="272" rx="5" ry="4" />
  <rect class="die" x="771" y="236" width="120" height="32" rx="3" />
  <rect class="die" x="771" y="204" width="120" height="32" rx="3" />
  <rect class="hbm" x="771" y="172" width="120" height="32" rx="3" />
  <rect class="cu" x="773" y="234" width="4" height="4" />
  <rect class="cu" x="783" y="234" width="4" height="4" />
  <rect class="cu" x="793" y="234" width="4" height="4" />
  <rect class="cu" x="803" y="234" width="4" height="4" />
  <rect class="cu" x="813" y="234" width="4" height="4" />
  <rect class="cu" x="823" y="234" width="4" height="4" />
  <rect class="cu" x="833" y="234" width="4" height="4" />
  <rect class="cu" x="843" y="234" width="4" height="4" />
  <rect class="cu" x="853" y="234" width="4" height="4" />
  <rect class="cu" x="863" y="234" width="4" height="4" />
  <rect class="cu" x="873" y="234" width="4" height="4" />
  <rect class="cu" x="883" y="234" width="4" height="4" />
  <rect class="cu" x="773" y="202" width="4" height="4" />
  <rect class="cu" x="783" y="202" width="4" height="4" />
  <rect class="cu" x="793" y="202" width="4" height="4" />
  <rect class="cu" x="803" y="202" width="4" height="4" />
  <rect class="cu" x="813" y="202" width="4" height="4" />
  <rect class="cu" x="823" y="202" width="4" height="4" />
  <rect class="cu" x="833" y="202" width="4" height="4" />
  <rect class="cu" x="843" y="202" width="4" height="4" />
  <rect class="cu" x="853" y="202" width="4" height="4" />
  <rect class="cu" x="863" y="202" width="4" height="4" />
  <rect class="cu" x="873" y="202" width="4" height="4" />
  <rect class="cu" x="883" y="202" width="4" height="4" />
  <line class="tsv" x1="785" y1="172" x2="785" y2="268" />
  <line class="tsv" x1="815" y1="172" x2="815" y2="268" />
  <line class="tsv" x1="845" y1="172" x2="845" y2="268" />
  <line class="tsv" x1="875" y1="172" x2="875" y2="268" />
  <circle class="ball" cx="771" cy="318" r="8" />
  <circle class="ball" cx="801" cy="318" r="8" />
  <circle class="ball" cx="831" cy="318" r="8" />
  <circle class="ball" cx="861" cy="318" r="8" />
  <circle class="ball" cx="891" cy="318" r="8" />

</svg>
