<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img">
  <title>Dicing kerf: the cut a diamond blade leaves in silicon is the blade width plus the chipping on each side</title>
  <desc>Cross-section of a wafer on dicing tape, cut by a diamond blade between two dies. The blade is 40 micrometres wide; chipping adds about 20 micrometres on each side, so the kerf is wider than the blade. Schematic, not to scale.</desc>
  <rect width="960" height="410" fill="#ffffff" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030" />
    </marker>
  </defs>
  <style>
    .pt { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .inv { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .val { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .unit { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .alert { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c53030; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .metal { fill: #ed8936; stroke: #c05621; stroke-width: 1.3; }
    .gold { fill: #f6e05e; stroke: #b7791f; stroke-width: 1.3; }
    .dark { fill: #4a5568; stroke: #2d3748; stroke-width: 1.3; }
    .pcb { fill: #c6f6d5; stroke: #2f855a; stroke-width: 1.3; }
    .chip { fill: #fed7d7; stroke: #c53030; stroke-width: 1.2; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .dim { fill: none; stroke: #718096; stroke-width: 1.2; }
    .wire { fill: none; stroke: #b7791f; stroke-width: 3; }
    .needle { fill: none; stroke: #2d3748; stroke-width: 3; }
    .track { fill: none; stroke: #c53030; stroke-width: 2.4; }
    .ehp { fill: #c53030; }
    .ehp2 { fill: #2b6cb0; }
  </style>

  <rect class="si" x="80" y="220" width="330" height="70" />
  <rect class="si" x="550" y="220" width="330" height="70" />
  <text class="t" x="245" y="262" text-anchor="middle">die</text>
  <text class="t" x="715" y="262" text-anchor="middle">die</text>
  <path class="chip" d="M 410,220 L 440,220 L 440,290 L 410,290 L 420,270 L 412,250 Z" />
  <path class="chip" d="M 550,220 L 520,220 L 520,290 L 550,290 L 540,268 L 548,246 Z" />
  <rect x="440" y="100" width="80" height="196" fill="#a0aec0" stroke="#4a5568" stroke-width="1.4" />
  <text class="t" x="480" y="88" text-anchor="middle">diamond blade</text>
  <rect x="60" y="290" width="840" height="16" fill="#b9d9f5" stroke="#2b6cb0" stroke-width="1" />
  <path class="lead" d="M 860,300 L 860,334" />
  <text class="t" x="856" y="339" text-anchor="end">dicing tape</text>
  <path class="dim" d="M 440,334 L 520,334" marker-start="url(#arr)" marker-end="url(#arr)" />
  <text x="480" y="360" text-anchor="middle"><tspan class="val">40</tspan><tspan class="unit"> &#181;m blade</tspan></text>
  <path class="dim" d="M 410,196 L 440,196" marker-start="url(#arr)" marker-end="url(#arr)" />
  <text x="402" y="184" text-anchor="end"><tspan class="val">~20</tspan><tspan class="unit"> &#181;m chipping</tspan></text>
  <path class="dim" d="M 520,196 L 550,196" marker-start="url(#arr)" marker-end="url(#arr)" />
  <text x="558" y="184"><tspan class="val">~20</tspan><tspan class="unit"> &#181;m</tspan></text>
  <path class="dim" d="M 410,390 L 550,390" marker-start="url(#arr)" marker-end="url(#arr)" />
  <text class="t" x="562" y="396">kerf</text>
</svg>
