<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img">
  <title>Polysilicon route: quartzite to metallurgical silicon, chlorination to trichlorosilane, fractional distillation, then Siemens or fluidized bed deposition</title>
  <defs>
    <marker id="poliArrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#718096" />
    </marker>
  </defs>
  <style>
    .t { font: 600 13.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .s { font: 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .eq { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #2d3748; }
    .feed { fill: #fefcbf; stroke: #b7791f; stroke-width: 1.5; }
    .heat { fill: #fed7d7; stroke: #c53030; stroke-width: 1.5; }
    .solid { fill: #edf2f7; stroke: #a0aec0; stroke-width: 1.5; }
    .chem { fill: #e9d8fd; stroke: #6b46c1; stroke-width: 1.5; }
    .dep { fill: #bee3f8; stroke: #2b6cb0; stroke-width: 1.5; }
    .out { fill: #c6f6d5; stroke: #2f855a; stroke-width: 1.5; }
    .flow { stroke: #718096; stroke-width: 2; fill: none; }
  </style>

  <!-- ===================== row 1: quartzite to MG-Si ===================== -->
  <rect class="feed" x="30" y="56" width="250" height="78" rx="8" />
  <text class="t" x="155" y="84" text-anchor="middle">Quartzito + carbono</text>
  <text class="s" x="155" y="104" text-anchor="middle">SiO2, coque, grafita</text>
  <text class="s" x="155" y="122" text-anchor="middle">ou cavacos de madeira</text>

  <path class="flow" d="M280,95 L314,95" marker-end="url(#poliArrow)" />

  <rect class="heat" x="320" y="56" width="270" height="78" rx="8" />
  <text class="t" x="455" y="84" text-anchor="middle">Forno de arco submerso</text>
  <text class="s" x="455" y="104" text-anchor="middle">~2000 &#176;C, eletrodos trifasicos</text>
  <text class="eq" x="455" y="122" text-anchor="middle">SiO2 + 2C &#8594; Si + 2CO</text>

  <path class="flow" d="M590,95 L624,95" marker-end="url(#poliArrow)" />

  <rect class="solid" x="630" y="56" width="260" height="78" rx="8" />
  <text class="t" x="760" y="84" text-anchor="middle">MG-Si fundido</text>
  <text class="s" x="760" y="104" text-anchor="middle">98 a 99,5 % de pureza</text>
  <text class="s" x="760" y="122" text-anchor="middle">drenado pelo fundo do forno</text>

  <path class="flow" d="M760,134 L760,182" marker-end="url(#poliArrow)" />

  <!-- ===================== row 2 (right to left): TCS ===================== -->
  <rect class="chem" x="630" y="190" width="260" height="78" rx="8" />
  <text class="t" x="760" y="218" text-anchor="middle">Destilacao fracionada</text>
  <text class="s" x="760" y="238" text-anchor="middle">TCS separado de H2 e HCl</text>
  <text class="s" x="760" y="256" text-anchor="middle">p.e. 31,8 &#176;C</text>

  <path class="flow" d="M630,229 L596,229" marker-end="url(#poliArrow)" />

  <rect class="chem" x="320" y="190" width="270" height="78" rx="8" />
  <text class="t" x="455" y="218" text-anchor="middle">Leito fluidizado + HCl</text>
  <text class="s" x="455" y="238" text-anchor="middle">alta pressao, com catalisador</text>
  <text class="eq" x="455" y="256" text-anchor="middle">Si + 3HCl &#8594; SiHCl3 + H2</text>

  <path class="flow" d="M314,229 L288,229" marker-end="url(#poliArrow)" />

  <rect class="solid" x="30" y="190" width="250" height="78" rx="8" />
  <text class="t" x="155" y="218" text-anchor="middle">Moagem do MG-Si</text>
  <text class="s" x="155" y="238" text-anchor="middle">po fino: mais area</text>
  <text class="s" x="155" y="256" text-anchor="middle">de contato com o gas</text>

  <!-- ===================== split into the two deposition reactors ===================== -->
  <path class="flow" d="M155,268 L155,310" />
  <path class="flow" d="M155,310 L695,310" />
  <path class="flow" d="M155,310 L155,332" marker-end="url(#poliArrow)" />
  <path class="flow" d="M695,310 L695,332" marker-end="url(#poliArrow)" />

  <rect class="dep" x="30" y="340" width="250" height="78" rx="8" />
  <text class="t" x="155" y="368" text-anchor="middle">Processo Siemens (CVD)</text>
  <text class="s" x="155" y="388" text-anchor="middle">1100 a 1150 &#176;C</text>
  <text class="s" x="155" y="406" text-anchor="middle">bastoes de 15 a 20 cm</text>

  <rect class="dep" x="530" y="340" width="330" height="78" rx="8" />
  <text class="t" x="695" y="368" text-anchor="middle">Processo FBR (granulos)</text>
  <text class="s" x="695" y="388" text-anchor="middle">650 a 700 &#176;C com SiH4</text>
  <text class="s" x="695" y="406" text-anchor="middle">deposicao continua nas sementes</text>

  <path class="flow" d="M155,418 L155,462" marker-end="url(#poliArrow)" />
  <path class="flow" d="M695,418 L695,462" marker-end="url(#poliArrow)" />

  <rect class="out" x="140" y="470" width="660" height="58" rx="8" />
  <text class="t" x="470" y="494" text-anchor="middle">Polissilicio grau solar ou eletronico</text>
  <text class="s" x="470" y="514" text-anchor="middle">7N a 11N &#8212; pedacos e granulos prontos para a fusao do lingote</text>
</svg>
