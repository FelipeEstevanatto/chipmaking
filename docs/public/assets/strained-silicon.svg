<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img">
  <title>Strained silicon: a relaxed silicon-germanium layer has a wider atomic spacing than silicon, so a thin silicon layer grown on it is stretched sideways to match, and electrons cross the stretched channel faster</title>
  <desc>Three panels. Left: relaxed silicon and relaxed silicon-germanium lattices side by side, the SiGe atoms spaced further apart. Centre: a thin silicon layer grown on SiGe, its atoms pulled apart to the SiGe spacing, with outward arrows marking tensile strain. Right: an electron path through a relaxed channel and a strained channel, the strained one drawn longer per unit time. Schematic: the difference in spacing, about 4 percent between Si and Ge, is exaggerated many times.</desc>
  <rect width="960" height="400" fill="#ffffff" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030" />
    </marker>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .pt { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .note { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.4; }
    .ge { fill: #b794f4; stroke: #553c9a; stroke-width: 1.4; }
    .bond { stroke: #a0aec0; stroke-width: 1.4; }
    .strain { fill: none; stroke: #c53030; stroke-width: 2; }
    .path { fill: none; stroke: #2b6cb0; stroke-width: 2.4; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 5 4; }
  </style>

