<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img">
  <title>Strained silicon: relaxed silicon and silicon-germanium lattices, a thin silicon layer stretched to match the SiGe spacing, and an electron crossing the strained channel further in the same time</title>
  <desc>Three panels. Panel 1: a relaxed silicon lattice and a relaxed silicon-germanium lattice side by side, the SiGe atoms spaced further apart. Panel 2: a thin silicon layer grown on SiGe, its atoms pulled sideways to the SiGe spacing, with outward arrows marking tensile strain. Panel 3: a transistor cross-section with a gate, source, drain, a dashed ellipse around the channel and a current path through it, beside two lattice rows with arrows, the strained arrow drawn longer for the same time. Schematic: the difference in spacing is exaggerated many times.</desc>
  <rect width="960" height="660" fill="#ffffff" />
  <defs>
    <radialGradient id="siAtom" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#cfd8e3" />
      <stop offset="100%" stop-color="#7d8b9c" />
    </radialGradient>
    <radialGradient id="geAtom" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f7fafc" />
      <stop offset="45%" stop-color="#68d391" />
      <stop offset="100%" stop-color="#2f855a" />
    </radialGradient>
    <radialGradient id="electronAtom" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f7fafc" />
      <stop offset="50%" stop-color="#4299e1" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </radialGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
  </defs>
  <style>
    .h { font: 600 23px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .pt { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .note { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .val { font: 600 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c53030; }
