<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img">
  <title>Cross-section of the wafer surface before and after chemical etching: the microcracked layer left by slicing and lapping, and the same surface once 10 to 30 micrometres have been etched away</title>
  <rect width="960" height="540" fill="#ffffff" />
  <defs>
    <pattern id="dmg" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#fdeaea" />
      <line x1="0" y1="0" x2="0" y2="9" stroke="#e9a3a3" stroke-width="1.7" />
    </pattern>
  </defs>
  <style>
    .h { font: 600 21px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .t { font: 600 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .l { font: 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 16.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3d4756; }
    .m { font: 600 16.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1d2430; }
    .si { fill: #cfd8e3; stroke: #7d8b9c; stroke-width: 1.5; }
    .band { fill: url(#dmg); stroke: #d98b8b; stroke-width: 1.3; }
    .ghost { fill: none; stroke: #a0aec0; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .crack { fill: none; stroke: #c53030; stroke-width: 1.6; stroke-linejoin: round; }
    .front { stroke: #b7791f; stroke-width: 1.6; stroke-dasharray: 7 5; }
    .axis { stroke: #4a5568; stroke-width: 1.3; }
    .etch { fill: none; stroke: #2b6cb0; stroke-width: 2; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>

  <text class="h" x="40" y="36">Etching away the damaged layer</text>
  <text class="sm" x="40" y="58">Same vertical scale in both panels; the depth bar is in micrometres below the original surface.</text>

  <!-- ===================== left: before ===================== -->
  <text class="t" x="40" y="106">After slicing and lapping</text>

  <line class="axis" x1="100" y1="170" x2="100" y2="290" />
  <line class="axis" x1="94" y1="170" x2="106" y2="170" />
  <line class="axis" x1="94" y1="210" x2="106" y2="210" />
  <line class="axis" x1="94" y1="250" x2="106" y2="250" />
  <line class="axis" x1="94" y1="290" x2="106" y2="290" />
  <text class="m" x="88" y="175" text-anchor="end">0</text>
  <text class="m" x="88" y="215" text-anchor="end">10</text>
  <text class="m" x="88" y="255" text-anchor="end">20</text>
  <text class="m" x="88" y="295" text-anchor="end">30</text>

  <rect class="si" x="130" y="170" width="330" height="120" />
  <rect class="band" x="130" y="170" width="330" height="80" />
  <line class="front" x1="130" y1="250" x2="460" y2="250" />

  <path class="crack" d="M 180,172 L 192,198 L 184,222" />
  <path class="crack" d="M 250,172 L 262,206 L 254,236" />
  <path class="crack" d="M 320,172 L 334,200 L 326,230" />
  <path class="crack" d="M 390,172 L 400,208 L 392,238" />
  <path class="crack" d="M 210,196 L 232,190 L 244,202" />

  <text class="l" x="295" y="150" text-anchor="middle">damaged layer</text>
  <path class="lead" d="M 295,156 L 295,182" />

  <text class="l" x="295" y="322" text-anchor="middle">bulk silicon</text>
  <path class="lead" d="M 295,314 L 295,272" />

  <!-- ===================== right: after ===================== -->
  <text class="t" x="555" y="106">After the etch</text>

  <line class="axis" x1="530" y1="170" x2="530" y2="290" />
  <line class="axis" x1="524" y1="170" x2="536" y2="170" />
  <line class="axis" x1="524" y1="210" x2="536" y2="210" />
  <line class="axis" x1="524" y1="250" x2="536" y2="250" />
  <line class="axis" x1="524" y1="290" x2="536" y2="290" />
  <text class="m" x="518" y="175" text-anchor="end">0</text>
  <text class="m" x="518" y="215" text-anchor="end">10</text>
  <text class="m" x="518" y="255" text-anchor="end">20</text>
  <text class="m" x="518" y="295" text-anchor="end">30</text>

  <rect class="ghost" x="560" y="170" width="330" height="80" />
  <rect class="si" x="560" y="250" width="330" height="40" />

  <!-- the etchant attacks both faces and keeps going until the damage is gone -->
  <path class="etch" d="M 620,196 L 620,232 M 615,224 L 620,234 L 625,224" />
  <path class="etch" d="M 690,196 L 690,232 M 685,224 L 690,234 L 695,224" />
  <path class="etch" d="M 760,196 L 760,232 M 755,224 L 760,234 L 765,224" />
  <path class="etch" d="M 830,196 L 830,232 M 825,224 L 830,234 L 835,224" />

  <text class="l" x="725" y="150" text-anchor="middle">removed by the etch</text>
  <path class="lead" d="M 725,156 L 725,182" />

  <text class="l" x="725" y="322" text-anchor="middle">new surface</text>
  <path class="lead" d="M 725,314 L 725,252" />

  <text class="sm" x="46" y="366">Acid etch (HF + HNO&#8323; + CH&#8323;COOH) removes silicon in every direction at the same</text>
  <text class="sm" x="46" y="388">rate, so it clears the damage without regard to crystal orientation. Alkaline etch</text>
  <text class="sm" x="46" y="410">(KOH or NaOH) is orientation-dependent and leaves the wafer flatter and cleaner.</text>
</svg>
