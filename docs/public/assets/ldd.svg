<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img">
  <title>A conventional drain junction compared with a lightly doped drain: the conventional device places the heavily doped contact at the gate edge, while the LDD inserts a lightly doped extension under a sidewall spacer and offsets the contact away from the gate</title>
  <desc>Two n-channel transistor cross-sections side by side. Left: a single heavily doped source and drain, self-aligned to the gate, with the peak electric field at the drain corner. Right: a lightly doped extension that reaches slightly under the gate, a sidewall spacer resting above it, and the heavily doped contact pushed outwards by the spacer width. The extension is drawn deeper than the contact, as a phosphorus extension against an arsenic contact gives in this era. Every region is labelled. Not to scale.</desc>
  <rect width="800" height="400" fill="#ffffff" />
  <style>
    .head { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .lbl { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .sm { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .inv { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .nd { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a365d; }
    .bad { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #c53030; }
    .good { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2f855a; }
    .si { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .nplus { fill: #2b6cb0; stroke: #2c5282; stroke-width: 1; }
    .nminus { fill: #90cdf4; stroke: #4299e1; stroke-width: 1; }
    .ox { fill: #f6e05e; stroke: #b7791f; stroke-width: 1; }
    .gate { fill: #4a5568; stroke: #2d3748; stroke-width: 1; }
    .sp { fill: #b794f4; stroke: #805ad5; stroke-width: 1; }
    .lead { fill: none; stroke: #718096; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .hot { fill: #c53030; }
    .low { fill: #2f855a; }
  </style>

  <text class="head" x="215" y="44" text-anchor="middle">Conventional</text>
  <text class="bad" x="215" y="68" text-anchor="middle">abrupt junction: peak field</text>

  <text class="head" x="585" y="44" text-anchor="middle">LDD with spacer</text>
  <text class="good" x="585" y="68" text-anchor="middle">graded junction: lower field</text>

  <line class="divider" x1="400" y1="88" x2="400" y2="320" />

  <rect class="si" x="85" y="180" width="260" height="110" />
  <rect class="ox" x="85" y="172" width="260" height="8" />
  <rect class="nplus" x="85" y="180" width="95" height="46" />
  <rect class="nplus" x="250" y="180" width="95" height="46" />
  <rect class="gate" x="180" y="146" width="70" height="36" />
  <circle class="hot" cx="250" cy="186" r="4" />

  <text class="inv" x="215" y="168" text-anchor="middle">gate</text>
  <text class="inv" x="132" y="206" text-anchor="middle">n+</text>
  <text class="inv" x="298" y="206" text-anchor="middle">n+</text>
  <text class="sm" x="132" y="162" text-anchor="middle">source</text>
  <text class="sm" x="298" y="162" text-anchor="middle">drain</text>
  <text class="sm" x="215" y="264" text-anchor="middle">p-type silicon</text>

  <rect class="si" x="425" y="180" width="320" height="110" />
  <rect class="ox" x="425" y="172" width="320" height="8" />
  <rect class="nminus" x="513" y="180" width="47" height="70" />
  <rect class="nminus" x="610" y="180" width="47" height="70" />
  <rect class="nplus" x="425" y="180" width="99" height="46" />
  <rect class="nplus" x="646" y="180" width="99" height="46" />
  <rect class="gate" x="550" y="146" width="70" height="36" />
  <rect class="sp" x="524" y="150" width="26" height="32" />
  <rect class="sp" x="620" y="150" width="26" height="32" />
  <circle class="low" cx="524" cy="190" r="4" />

  <text class="inv" x="585" y="168" text-anchor="middle">gate</text>
  <text class="inv" x="474" y="206" text-anchor="middle">n+</text>
  <text class="inv" x="696" y="206" text-anchor="middle">n+</text>
  <text class="nd" x="537" y="222" text-anchor="middle">n&#8722;</text>
  <text class="nd" x="633" y="222" text-anchor="middle">n&#8722;</text>
  <text class="sm" x="474" y="162" text-anchor="middle">source</text>
  <text class="sm" x="696" y="162" text-anchor="middle">drain</text>
  <text class="lbl" x="696" y="128" text-anchor="middle">spacer</text>
  <path class="lead" d="M696,136 L645,150" />
  <text class="sm" x="585" y="264" text-anchor="middle">p-type silicon</text>
</svg>
