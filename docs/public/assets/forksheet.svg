<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img">
  <title>Gate-all-around nanosheets with a wide n-p gap versus a forksheet with a dielectric wall between the n and p gates</title>
  <style>
    .inv { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffffff; }
    .note { font: 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .head { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .si { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .gate { fill: #4a5568; stroke: #2d3748; stroke-width: 1; }
    .chan { fill: #63b3ed; stroke: #2b6cb0; stroke-width: 1; }
    .wall { fill: #805ad5; stroke: #553c9a; stroke-width: 1; }
    .dim { stroke: #718096; stroke-width: 1.3; fill: none; }
    .lead { stroke: #718096; stroke-width: 1; fill: none; }
    .divider { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 5; }
  </style>

  <text class="head" x="200" y="34" text-anchor="middle">nanosheet GAA</text>
  <text class="head" x="600" y="34" text-anchor="middle">forksheet</text>
  <line class="divider" x1="400" y1="52" x2="400" y2="386" />

  <!-- ================= LEFT: nanosheets ================= -->
  <text class="note" x="126" y="80" text-anchor="middle">p gate</text>
  <text class="note" x="274" y="80" text-anchor="middle">n gate</text>

  <rect class="gate" x="90" y="90" width="72" height="160" />
  <rect class="chan" x="99" y="104" width="54" height="16" />
  <rect class="chan" x="99" y="146" width="54" height="16" />
  <rect class="chan" x="99" y="188" width="54" height="16" />

  <rect class="gate" x="238" y="90" width="72" height="160" />
  <rect class="chan" x="247" y="104" width="54" height="16" />
  <rect class="chan" x="247" y="146" width="54" height="16" />
  <rect class="chan" x="247" y="188" width="54" height="16" />

  <rect class="si" x="60" y="250" width="280" height="50" />

  <path class="dim" d="M162,320 L238,320" />
  <path class="dim" d="M162,313 L162,327" />
  <path class="dim" d="M238,313 L238,327" />
  <text class="note" x="200" y="340" text-anchor="middle">wide n-p gap</text>
  <text class="note" x="200" y="376" text-anchor="middle">the two gate trenches must stay apart</text>

  <!-- ================= RIGHT: forksheet ================= -->
  <text class="note" x="529" y="80" text-anchor="middle">p gate</text>
  <text class="note" x="671" y="80" text-anchor="middle">n gate</text>

  <rect class="gate" x="486" y="90" width="86" height="160" />
  <rect class="chan" x="495" y="104" width="70" height="16" />
  <rect class="chan" x="495" y="146" width="70" height="16" />
  <rect class="chan" x="495" y="188" width="70" height="16" />

  <rect class="wall" x="572" y="82" width="16" height="176" />

  <rect class="gate" x="588" y="90" width="86" height="160" />
  <rect class="chan" x="595" y="104" width="70" height="16" />
  <rect class="chan" x="595" y="146" width="70" height="16" />
  <rect class="chan" x="595" y="188" width="70" height="16" />

  <rect class="si" x="460" y="250" width="280" height="50" />

  <path class="dim" d="M572,320 L588,320" />
  <path class="dim" d="M572,313 L572,327" />
  <path class="dim" d="M588,313 L588,327" />
  <path class="lead" d="M588,320 L640,320" />
  <text class="note" x="645" y="324">narrow n-p gap</text>

  <path class="lead" d="M580,258 L580,286" />
  <text class="note" x="580" y="300" text-anchor="middle">dielectric wall</text>
  <text class="note" x="600" y="376" text-anchor="middle">the wall lets the n and p gates sit closer</text>
</svg>
