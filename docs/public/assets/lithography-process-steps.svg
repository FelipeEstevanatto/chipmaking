<svg xmlns="http://www.w3.org/2000/svg" width="800" height="576" viewBox="0 0 800 576" role="img">
  <title>Eight-step photolithography cycle on a positive resist: clean and prime, spin coat, soft bake, align and expose, post-exposure bake, develop, hard bake, and etch and strip</title>
  <desc>Two rows of four panels, each showing the same silicon substrate at one point in the cycle. A resist film is applied, baked, exposed through a chrome-on-quartz mask, baked again, developed, baked a third time, and left as an etch mask. The mask is opaque chrome except for two clear slots; resist survives only under the chrome, and the etch cuts trenches into the silicon exactly where the slots were. Positive resist is shown. The projection optics between mask and wafer are omitted. Not to scale.</desc>
  <rect width="800" height="576" fill="#ffffff" />
  <defs>
    <marker id="ltArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#805ad5" />
    </marker>
    <marker id="spArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0" />
    </marker>
    <marker id="wrArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096" />
    </marker>
  </defs>
  <style>
    .t    { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a202c; }
    .a    { font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a5568; }
    .lbl  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2d3748; }
    .si   { fill: #cbd5e0; stroke: #a0aec0; stroke-width: 1; }
    .res  { fill: #c6f6d5; stroke: #2f855a; stroke-width: 1.2; }
    .exp  { fill: #68d391; stroke: #2f855a; stroke-width: 1.2; }
    .hp   { fill: #fed7d7; stroke: #c53030; stroke-width: 1.2; }
    .heat { stroke: #c53030; stroke-width: 1.4; fill: none; }
    .qz   { fill: #e2e8f0; stroke: #a0aec0; stroke-width: 1; }
    .cr   { fill: #2d3748; }
    .trench { fill: #ffffff; stroke: #4a5568; stroke-width: 1.2; }
    .drop { fill: #319795; }
    .light { stroke: #805ad5; stroke-width: 2; fill: none; marker-end: url(#ltArrow); }
    .spin  { stroke: #2b6cb0; stroke-width: 2; fill: none; marker-end: url(#spArrow); }
    .wrap  { stroke: #718096; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; marker-end: url(#wrArrow); }
    .chev  { stroke: #a0aec0; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .lead  { stroke: #718096; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .mark  { stroke: #2d3748; stroke-width: 1.4; fill: none; }
    .markq { stroke: #e2e8f0; stroke-width: 1.4; fill: none; }
  </style>

  <!-- ==================================================================
       ROW 1. Substrate surface at y=176, top of the resist at y=150,
       mask plate at y=96. Every panel shares this geometry so the reader
       can track one stack through the cycle.
       ================================================================== -->

  <!-- === 1. clean and prime === -->
  <text class="t" x="100" y="28" text-anchor="middle">1. Clean and prime</text>
  <text class="lbl" x="100" y="124" text-anchor="middle">HMDS</text>
  <path class="drop" d="M 100,134 L 107,150 Q 100,158 93,150 Z" />
  <rect class="si" x="12" y="176" width="176" height="44" />
  <rect class="hp" x="12" y="232" width="176" height="12" />
  <path class="heat" d="M 36,226 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 76,226 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 116,226 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 156,226 q 6,-7 12,0 q 6,7 12,0" />
  <text class="a" x="100" y="264" text-anchor="middle">150 &#176;C drives off water</text>
  <text class="a" x="100" y="282" text-anchor="middle">HMDS adds adhesion</text>

  <!-- === 2. spin coat === -->
  <text class="t" x="300" y="28" text-anchor="middle">2. Spin coat</text>
  <path class="spin" d="M 246,122 A 54,14 0 0 1 354,122" />
  <rect class="si" x="212" y="176" width="176" height="44" />
  <rect class="res" x="212" y="150" width="176" height="26" />
  <text class="lbl" x="228" y="202">Si</text>
  <text class="lbl" x="300" y="168" text-anchor="middle">resist</text>
  <text class="a" x="300" y="264" text-anchor="middle">thousands of RPM</text>
  <text class="a" x="300" y="282" text-anchor="middle">uniform resist film</text>

  <!-- === 3. soft bake === -->
  <text class="t" x="500" y="28" text-anchor="middle">3. Soft bake</text>
  <rect class="si" x="412" y="176" width="176" height="44" />
  <rect class="res" x="412" y="150" width="176" height="26" />
  <rect class="hp" x="412" y="232" width="176" height="12" />
  <path class="heat" d="M 436,226 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 476,226 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 516,226 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 556,226 q 6,-7 12,0 q 6,7 12,0" />
  <text class="a" x="500" y="264" text-anchor="middle">90-100 &#176;C hotplate</text>
  <text class="a" x="500" y="282" text-anchor="middle">solvent leaves the film</text>

  <!-- === 4. align and expose === -->
  <text class="t" x="700" y="28" text-anchor="middle">4. Align and expose</text>
  <text class="lbl" x="650" y="80" text-anchor="middle">mask</text>
  <path class="lead" d="M 650,86 L 650,94" />
  <text class="lbl" x="776" y="80" text-anchor="middle">align</text>
  <path class="lead" d="M 778,86 L 780,94" />
  <rect class="qz" x="612" y="96" width="176" height="16" />
  <rect class="cr" x="612" y="96" width="51" height="16" />
  <rect class="cr" x="689" y="96" width="22" height="16" />
  <rect class="cr" x="737" y="96" width="51" height="16" />
  <path class="markq" d="M 772,104 L 788,104" />
  <path class="markq" d="M 780,96 L 780,112" />
  <path class="light" d="M 676,120 L 676,146" />
  <path class="light" d="M 724,120 L 724,146" />
  <rect class="si" x="612" y="176" width="176" height="44" />
  <rect class="res" x="612" y="150" width="176" height="26" />
  <rect class="exp" x="663" y="150" width="26" height="26" />
  <rect class="exp" x="711" y="150" width="26" height="26" />
  <path class="mark" d="M 772,190 L 788,190" />
  <path class="mark" d="M 780,182 L 780,198" />
  <text class="a" x="700" y="264" text-anchor="middle">chrome blocks the light</text>
  <text class="a" x="700" y="282" text-anchor="middle">gaps turn soluble</text>

  <!-- === row return === -->
  <path class="wrap" d="M 792,228 L 792,304 L 4,304" />

  <!-- ==================================================================
       ROW 2. Substrate surface at y=456, top of the resist at y=430.
       ================================================================== -->

  <!-- === 5. post-exposure bake === -->
  <text class="t" x="100" y="326" text-anchor="middle">5. Post-exposure bake</text>
  <rect class="si" x="12" y="456" width="176" height="44" />
  <rect class="res" x="12" y="430" width="176" height="26" />
  <rect class="exp" x="63" y="430" width="26" height="26" />
  <rect class="exp" x="111" y="430" width="26" height="26" />
  <rect class="hp" x="12" y="512" width="176" height="12" />
  <path class="heat" d="M 36,506 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 76,506 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 116,506 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 156,506 q 6,-7 12,0 q 6,7 12,0" />
  <text class="a" x="100" y="544" text-anchor="middle">100-130 &#176;C</text>
  <text class="a" x="100" y="562" text-anchor="middle">acid does its work</text>

  <!-- === 6. develop === -->
  <text class="t" x="300" y="326" text-anchor="middle">6. Develop</text>
  <rect class="si" x="212" y="456" width="176" height="44" />
  <rect class="res" x="212" y="430" width="51" height="26" />
  <rect class="res" x="289" y="430" width="22" height="26" />
  <rect class="res" x="337" y="430" width="51" height="26" />
  <circle class="drop" cx="300" cy="410" r="4" />
  <circle class="drop" cx="316" cy="402" r="4" />
  <circle class="drop" cx="332" cy="410" r="4" />
  <text class="a" x="300" y="544" text-anchor="middle">TMAH dissolves</text>
  <text class="a" x="300" y="562" text-anchor="middle">the exposed resist</text>

  <!-- === 7. hard bake === -->
  <text class="t" x="500" y="326" text-anchor="middle">7. Hard bake</text>
  <rect class="si" x="412" y="456" width="176" height="44" />
  <rect class="res" x="412" y="430" width="51" height="26" />
  <rect class="res" x="489" y="430" width="22" height="26" />
  <rect class="res" x="537" y="430" width="51" height="26" />
  <rect class="hp" x="412" y="512" width="176" height="12" />
  <path class="heat" d="M 436,506 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 476,506 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 516,506 q 6,-7 12,0 q 6,7 12,0" />
  <path class="heat" d="M 556,506 q 6,-7 12,0 q 6,7 12,0" />
  <text class="a" x="500" y="544" text-anchor="middle">120-150 &#176;C</text>
  <text class="a" x="500" y="562" text-anchor="middle">resist hardens</text>

  <!-- === 8. etch and strip === -->
  <text class="t" x="700" y="326" text-anchor="middle">8. Etch and strip</text>
  <rect class="si" x="612" y="456" width="176" height="44" />
  <rect class="trench" x="663" y="456" width="26" height="20" />
  <rect class="trench" x="711" y="456" width="26" height="20" />
  <text class="a" x="700" y="544" text-anchor="middle">pattern transferred</text>
  <text class="a" x="700" y="562" text-anchor="middle">resist stripped</text>

  <!-- === between-panel chevrons === -->
  <path class="chev" d="M 194,192 L 202,198 L 194,204" />
  <path class="chev" d="M 394,192 L 402,198 L 394,204" />
  <path class="chev" d="M 594,192 L 602,198 L 594,204" />
  <path class="chev" d="M 194,472 L 202,478 L 194,484" />
  <path class="chev" d="M 394,472 L 402,478 L 394,484" />
  <path class="chev" d="M 594,472 L 602,478 L 594,484" />
</svg>
